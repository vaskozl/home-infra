version: '3'
services:
  syncthing:
    image: ghcr.io/vaskozl/syncthing:2.1.6@sha256:b01047218f80537cc8e3fe2207d06255d6e7efc8c17d4178406adb6305f1f45a
    container_name: syncthing
    restart: unless-stopped
    network_mode: host
    user: "568:568"
    environment:
      - HOME=/var/syncthing
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - /volume3/syncthing/data:/var/syncthing
      - /volume3/photo:/volume3/photo:ro
      - /volume3/k8s-volumes/vaultwarden-data-vaultwarden-0-pvc-1fc48917-f0c2-4a0f-8667-80cf47da1dc9:/volume3/vaultwarden:ro
    cpu_shares: 16
    mem_limit: 2G
