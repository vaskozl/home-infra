version: '3'
services:
  qbittorrent:
    image: ghcr.io/vaskozl/qbittorrent-nox:5.3.0@sha256:faffa8a7e540a45d8d7755b7d93240a5fcd2e8cee980a4ce20be0e6ee211e0ed
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      - HOME=/config
      - XDG_CONFIG_HOME=/config
      - XDG_DATA_HOME=/config
    volumes:
      - /volume3/docker/qbittorrent/config:/config
      - /volume1/torrents-v2/torrents:/torrents
    entrypoint:
      - /bin/sh
      - -c
      - rm -f /config/qBittorrent/lockfile; exec nice -n 10 ionice -c3 qbittorrent-nox --webui-port='55555'
    stop_grace_period: 2m
    cpu_shares: 16
    mem_limit: 4G
  cross-seedd:
    image: ghcr.io/cross-seed/cross-seed:6.13.9@sha256:c310f84e040b82c140424f6377fa36487335261037175ef9cec3aefc92b93076
    container_name: cross-seedd
    restart: unless-stopped
    network_mode: host
    user: "568:568"
    cpu_shares: 16
    mem_limit: 1G
    volumes:
      - /volume3/docker/qbittorrent/config/qBittorrent/BT_backup/:/torrents:ro
      - /volume3/docker/qbittorrent/config/cross-seeds:/cross-seeds
      - /volume3/docker/qbittorrent/config/cross-config:/config
    command: daemon
