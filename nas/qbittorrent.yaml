version: '3'
services:
  qbittorrent:
    image: ghcr.io/vaskozl/qbittorrent-nox:5.2.4@sha256:7cc4a5a7cccfe22a0fa42467fd5e735abfc4d83faecb508332b83a926ab4071a
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      - HOME=/config
      - XDG_CONFIG_HOME=/config
      - XDG_DATA_HOME=/config
    volumes:
      - /volume3/docker/qbittorrent/config:/config
      - /volume1/torrents-v2/torrents:/torrents
    entrypoint:
      - /bin/sh
      - -c
      - rm -f /config/qBittorrent/lockfile; exec nice -n 10 ionice -c3 qbittorrent-nox --webui-port='55555'
    stop_grace_period: 2m
    cpu_shares: 16
    mem_limit: 4G
  cross-seedd:
    image: ghcr.io/cross-seed/cross-seed:6.13.8@sha256:fff0961439b7813b08c2496f5145b9d6cc621efd4f1f2f620a67da570b7db1fb
    container_name: cross-seedd
    restart: unless-stopped
    network_mode: host
    user: "568:568"
    cpu_shares: 16
    mem_limit: 1G
    volumes:
      - /volume3/docker/qbittorrent/config/qBittorrent/BT_backup/:/torrents:ro
      - /volume3/docker/qbittorrent/config/cross-seeds:/cross-seeds
      - /volume3/docker/qbittorrent/config/cross-config:/config
    command: daemon
