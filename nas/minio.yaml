version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:ddcbafff1866eab85d1ffb45282f818744e477b58052d46e619426f7118ae504
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
