version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:519b0e73c0e31462644ec2335084c395edf6d87f0639abcb54a69200367058e0
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
