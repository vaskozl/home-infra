version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:c7b69c98f91617a189e7f1295c72ddfbefcde053e761a5304d707629f1155a2e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
