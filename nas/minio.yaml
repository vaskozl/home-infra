version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261123@sha256:52a442e97b745e809441cdc20bb800c043ec44f5963c2922463c8ada84d39ff9
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
