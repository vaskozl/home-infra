version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:03799e41a743f27824dc2626e72e822f7a7c0afbbb01873da036828cadae99f6
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
