    image: ghcr.io/vaskozl/minio:0.20260717@sha256:f65df287586910cc190919767c6113f35c7b8ec64da937d9da713c2dc658da15
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
