version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:10d2a013ac34243a9ab5892ec72701f51a51252ceb880e57642eae850284c62b
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
