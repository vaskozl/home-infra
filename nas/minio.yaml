version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:c5e6927ebbcd5a28466cf5e336256378a69d62d1e973b30f275fd4ab5b09c326
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
