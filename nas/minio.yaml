version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261109@sha256:8f71433214b79c8f8d95f4260c2e69a759f338376bca663cb5e96d0c04d8c8e9
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
