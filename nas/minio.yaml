version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:30b38381a81b65266c877dc762514db7cf49f8739ef2973cc903281ea22238e1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
