version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:2da60e7c62a2d777af04a2f6dab30b1527de2ff20252b8a3861a81900ec4027f
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
