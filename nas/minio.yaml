version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:e04f0f2e32e202a83fa2195c73f23d868970a6bae545f10839468b53eea879c9
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
