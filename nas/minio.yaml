version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:f8e09e8e8e8791b9f5be79b963f8eceb366362e981c2d886702a3ab3a795be1a
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
