version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261112@sha256:a2e2423c9f22e8d9975562b40b39874a7afc338ee6baf2a7db883fcdd36a73bc
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
