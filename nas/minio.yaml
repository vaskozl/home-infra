version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:3b12c3d72a5d8af899de3b516ea9d81cbba3128eea80351b90c7bcb3b456d78f
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
