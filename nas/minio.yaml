version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:5a62cb7c4a2848507143fafdf71a176b020419c352ce450f753f0285d2cb462c
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
