version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:ac9fdb50aecba8edeb8b58af277a84f240e2a027898e84da7848c23ecd41cd16
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
