version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:2a6e0b43f8e74f675a3b0fc57324a5ca20536ca9c41727368f21e61921c9ace9
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
