version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:eadcfb704c86b743e81e44c8667b57b7b69035fd230349d00d4a2de072840495
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
