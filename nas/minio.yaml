version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:ce837ce53ace084f7e74fe688a1d37a48045ca86b82555fcc0b2f36c80a0faca
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
