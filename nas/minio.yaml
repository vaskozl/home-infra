version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:8be33b22ddded09c62d059b0c14478e1d9afc60437b70540607e7b940ac7a038
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
