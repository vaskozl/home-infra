version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:dc000006716a8bf1fd03facf1c5c7daa27ca36ea257bce62f41a202599ac7548
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
