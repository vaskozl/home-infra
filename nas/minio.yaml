version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:b62ce2fe0d5273ecd9399c23b2261adbffa5adf5070f7923e078291cea0ea2b1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
