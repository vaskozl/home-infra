version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:e721e9d8f97551b42570ccc0ec2b70f8eae70abf4d49aee0aae890d75a87b2b8
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
