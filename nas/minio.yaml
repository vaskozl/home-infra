version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:33b53bc401d163dac2fe50d22bc78ff10da1a6592fa9efee58147ea8649010fa
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
