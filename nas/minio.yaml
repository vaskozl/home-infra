version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:ff0d459aa994203cf6a7ccd3740b499bdf6e2f1d753c01f2261286982defa2fd
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
