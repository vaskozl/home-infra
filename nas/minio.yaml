version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:8ec59d07b69d61d71a1bceabd30f04bd7cc1e194c2fc35ebca6cbcb7d8309f44
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
