version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260604@sha256:9e37d0c3429296293606f1bbc6938f35f4b33ac119522cedefbfa9c87fe84784
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
