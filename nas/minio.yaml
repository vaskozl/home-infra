version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:3bb65da23074544c707457391568a7257088d7abceb086111850310b87e03624
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
