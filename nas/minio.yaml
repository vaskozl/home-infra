version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:0c5f98ad85d305a7726ce394d05c985f94550d28ad594384c0a7009edda88440
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
