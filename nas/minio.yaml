version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:062a850e7c3c397574fa2681c5721092f6240c94464bc452023c492adeff7161
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
