version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:c331ebd781ba43ed77825454568060c9d4cf1c1a9037666f99b0453f649201f4
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
