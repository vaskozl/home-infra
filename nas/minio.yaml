version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261123@sha256:04da62b4ec2ac1cabce14e566b0c12a0605e4b6fb0a193a8bd9c7c327ec1ac06
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
