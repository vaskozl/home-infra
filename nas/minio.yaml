version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:9ba6746fd106c8c25285ea147a069b173a10ac9843fcb2403d7f23da477daef8
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
