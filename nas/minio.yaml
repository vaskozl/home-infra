version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:4f1af916cf3cc6e5ccd30827c9e61b116deb41193f00a784333d006d87e1724f
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
