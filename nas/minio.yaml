version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:5c592cb6981f3e473d20f2e6bd8266006f24f84a0577efb1a2346c6b1193da18
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
