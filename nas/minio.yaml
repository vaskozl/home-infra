version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:7b48cb89e1ef7023dea45248d46531f5a1ac6bd31ab5f2df606602482bbb5eeb
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
