version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:a4598b81ce768a18e3c783139ec29e3a850403592913d3f8c6fd8c0506b7851d
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
