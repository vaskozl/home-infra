version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:c46ac60b36f5e650418069418683482319e829f2b555803dd9f81c3004848185
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
