version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:3736792d8e8441d727f9a6a2294b37eeb8859f2fafafad3aa9ebdefd89100b6f
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
