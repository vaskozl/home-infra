version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:7dff7be3c84fb3a1cedb80fce18a91a27ad0a2239c52b34602fa0637b93230f2
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
