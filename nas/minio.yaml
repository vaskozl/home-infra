version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:ac96d033f8b9cabf28098a011f3a0e39d25a30d26ee5122d8ea597544bf8ca27
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
