version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:be0bb0ec8b6c327fb09dce6db10534c5a347a9e0a66d85630da3c0c7c36e568f
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
