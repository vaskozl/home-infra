version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:ea0505db7fdc1429f41e9406dcf1fd70db6b9eb9fbf0c23410a25726d5a54d1d
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
