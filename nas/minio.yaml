version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:eae2d99b5755131840d26bf4e9dd0b6d31fde286514edb1e4bddaa2c3cfdf918
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
