version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:08ad90c3b5f0b462d08839ba98b9c5639d1c01f00773ee4c50af31bd9259a4f8
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
