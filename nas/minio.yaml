version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261112@sha256:81f1edbc5c205a3dedc6b139fa36448a9686fa4b204ab91fb4bee7625bbcb1ef
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
