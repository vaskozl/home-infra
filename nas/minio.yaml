version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261123@sha256:90081b422a0b5b3b0a2b162cab37731a4bc1567a5dd749fadfef6ef4cd21a309
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
