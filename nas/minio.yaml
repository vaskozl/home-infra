version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261112@sha256:13bccb5a65e8ed733f7d49a27a682a3f01e1472368ca00ae9345a852671f6db6
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
