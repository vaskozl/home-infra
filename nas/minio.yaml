version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:1e6e5662c04796a2cfa5dbbc271577b341d20b8e008556a0a88eddbf189b5274
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
