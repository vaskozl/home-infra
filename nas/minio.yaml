version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:173683220d4fd42ec3181bed92c2bf8be92bb320dc0a6179c486fd51d49d9f4b
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
