version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:9646ff0669a94aeae4777efb896d1f020a070fb3e81fb755978de3dd526925d3
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
