version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:71af99b483fb303b0d384319ae7d3f9b34076103b599d3301d3cd4125d11bfdc
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
