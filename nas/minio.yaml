version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:27a55831a3ac46b25c648e1bf4a64e2bd0e03650f4c32de3785ed668a73724db
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
