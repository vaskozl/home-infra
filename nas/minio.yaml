version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261110@sha256:08692b89fca5e0308618a7dcea7d919d0497ea3cbf3edbac4ebfd72af2f75516
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
