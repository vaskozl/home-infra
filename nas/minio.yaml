version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:b3bf1351ceacd709174ee82f802fa6d71b9ba3ceb7ca200f3667ccf0c3f0b751
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
