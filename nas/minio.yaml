version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:0bac1fa047aecf9258f2fce386a77409021b5809b08df2e0707b4a96e0b2188a
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
