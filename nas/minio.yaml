version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261123@sha256:af1a95ff72bd2a8c3d638f7a9cc217338ff6e7ade74cc0306209ed3bae55cd2d
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
