version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:499320068389ed100b61def8ec702cec39637c88e921003e97e5983a854a6393
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
