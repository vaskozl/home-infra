version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:694d74d34cd3303f5da32bd93683b59defd476e7098840f040b303a0e79933e7
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
