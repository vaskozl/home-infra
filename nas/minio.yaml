version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:9535ebeed169ff1ce92afd24a286290238ae38acc13cea94c316b64f26823307
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
