version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:4e0e7712af4b907fe872c3a781c5ba40a284eaec549f286d24fdfd92b7903e91
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
