version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:0c612ec18a6eaa2596b47af2dfd925e9d2ff66376eff274cd8345e67c0a6606c
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
