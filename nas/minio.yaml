version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260921@sha256:00f8b5ffcc2c3010b18236dff0d5fce548f392bac8e169594478cf0c521fc394
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
