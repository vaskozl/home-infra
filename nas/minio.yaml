version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261109@sha256:3d5c9d3e7fccff2d209f1164ae1ed34868a81e991da8254b7ebd7e46097e52c0
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
