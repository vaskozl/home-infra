version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261123@sha256:44194b896c0af7927ca227d349d27cf924bb5aa97f81c9728df4da6755f0a718
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
