version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:94375ef4d3588e4cb5298e61cef75b0128542f000353dd9515a88e1e133457bd
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
