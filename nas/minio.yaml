version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:1d585c9d80de45d34f40c02c499a6464e1f62ba801fb057d75fce20066d41b83
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
