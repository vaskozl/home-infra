version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261112@sha256:a9a04f90ca173692b64ccdfb8129a079c8b644a7497020be8360d58e5436f367
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
