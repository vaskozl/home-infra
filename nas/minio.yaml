version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:8a2a25434fff217308add6527c4c2cb79e6e3c899cde617202df4281d4ac52b0
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
