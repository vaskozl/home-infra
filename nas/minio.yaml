version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261110@sha256:45e3d12cea71fa28febb2cfc5b4f623c39973e8f28cc4e3782b4ec82bfa7c6a1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
