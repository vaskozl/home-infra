version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:63e44e8b09a32f5c3792ade3e2c2ad0eff3b2edbf69c39503aa5ae69446dd1e0
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
