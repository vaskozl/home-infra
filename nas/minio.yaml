version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:1a9aa1236b027a498a5361c6550e8f53f6f0b542f63db3d78c2ec837977874ec
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
