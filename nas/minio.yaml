version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:8e40b47244032db468a7d6b5a30ca8f33d188c8117639dfeec043fa958b32d6a
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
