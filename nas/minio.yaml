version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260604@sha256:891e9c03438b0ddeac47eb96280774909ddc768d50c687f7440660d71848d834
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
