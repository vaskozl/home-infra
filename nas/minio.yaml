version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260922@sha256:7c8baae397da3f5eff3bf4c7de00c7c66980f44f39acf90d250afb71c53357d6
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
