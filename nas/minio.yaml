version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:5ab8973c129070027f8c2bd43034eb09d8f204cd2deaea8dac934c766c0fa4d3
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
