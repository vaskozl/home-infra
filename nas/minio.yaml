version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:a22ae2bf52948afcd8cfedb4a809ac9e07a009d4a2c2393d5d9b6e36f5b879bc
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
