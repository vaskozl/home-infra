version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:ee04abc44c488dd31e0ef2d724471bcbcdcc9eb161fcc0f37bb93bb9c8298f17
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
