version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:d5a8bdddd4a355f33709332d90e149e92e303f7fe6190f450136879abcb14c5e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
