version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:44113e7f210a6d5bdec0e59e8bf71841cc870b3bc96668edcc6792fefee1d337
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
