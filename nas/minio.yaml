version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20260717@sha256:e213ec7dbbe8ab8345a5f44852d662ac19d7b2bfaaf7c25034feea30607914bb
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
