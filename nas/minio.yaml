version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261023@sha256:374e85edef7c2282c7e9f43119d0f6a52b60ff906d3ca997ded826cb34c093c9
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
