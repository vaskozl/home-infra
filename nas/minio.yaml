version: '3'
services:
  s3:
    image: ghcr.io/vaskozl/minio:0.20261116@sha256:f8d400e57f6813b391e99927b6f720795ae0fc277c36e734353b70d7770d49d5
    command: server /data --console-address ":9001"
    restart: unless-stopped
    user: 1026:100
    env_file:
      - minio.enc.env
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - /volume3/docker/minio/data:/data
