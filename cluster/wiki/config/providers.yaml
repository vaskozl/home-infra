# yaml-language-server: $schema=https://gitlab.sko.ai/doudous/rekon/-/raw/main/contrib/auth/types/objects.schema.json
# Embedded mock OIDC issuer: signs in as any username typed. Stopgap until a
# real provider is added.
apiVersion: v1alpha1
kind: authproviders
spec:
  name: pi
  type: oidc
  displayName: Pocket ID
  icon: fingerprint
  issuer: "https://pi.sko.ai"
  clientId: "b71b9dea-df63-4d76-aba7-cd9ed1912c4f"
  clientSecretEnv: OIDC_CLIENT_SECRET
  scopes:
    - openid
    - profile
    - email
  emailVerifiedRequired: true
  enabled: true
