---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
  namespace: victoria-metrics
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: '0.98.1'
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
  namespace: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 24h0m0s
  targetNamespace: victoria-metrics
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: vm-secrets
  values:
    fullnameOverride: stack
    experimentalDashboardsEnabled: false
    # Disable rules whose underlying metrics we intentionally drop:
    #   - node-exporter runs with --collector.disable-defaults and only cpu/meminfo/nfs/uname
    #     (no loadavg, vmstat, diskstats, netdev)
    #   - kubelet metricRelabelConfigs drops container_memory_swap
    #   - KubeMemoryOvercommit is expected on this 7-node cluster, not actionable
    #   - InfoInhibitor/Watchdog are meta-alerts with no consumer here
    #   - CPUThrottlingHigh only ever fires on ephemeral pods here (gitlab runner
    #     build/helper containers with intentional cpu_limit, logrotate cronjobs);
    #     throttling on short-lived CPU-bound work is expected, not actionable
    #   - TooManyLogs: > 0 threshold fires continuously on vmagent scrape warnings
    #     (steady-state baseline ~85 warn lines/5m); real failures covered by ServiceDown/TooManyRestarts
    #   - LogErrors: > 0 threshold trips on vmoperator apiserver re-init flakes;
    #     real failures covered by ReconcileErrors/HighQueueDepth
    #   - KubePodNotReady: re-added in rules/pods.yaml without batch-class pods,
    #     which queue Pending on purpose when the node is full
    # Control-plane rule groups (apiserver/scheduler/controller-manager) are
    # disabled: the kube*.enabled toggles below only gate scraping and dashboards,
    # not the sync-job rule sources, so these groups get created and their
    # KubeAPIDown/KubeSchedulerDown/KubeControllerManagerDown alerts fire absent()
    # even though we intentionally do not scrape the control plane on Talos.
    # Group keys must match upstream group names exactly.
    defaultRules:
      groups:
        # kubelet metricRelabelConfigs drop container_memory_swap
        k8s.rules.container_memory_swap:
          enabled: false
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        kube-scheduler.rules:
          enabled: false
        kubernetes-system-apiserver:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        kubernetes-system-scheduler:
          enabled: false
      rules:
        KubeMemoryOvercommit:
          create: false
        InfoInhibitor:
          create: false
        KubePodNotReady:
          create: false
        Watchdog:
          create: false
        CPUThrottlingHigh:
          create: false
        TooManyLogs:
          create: false
        LogErrors:
          create: false
        "instance:node_load1_per_cpu:ratio":
          create: false
        "instance:node_vmstat_pgmajfault:rate5m":
          create: false
        "instance_device:node_disk_io_time_seconds:rate5m":
          create: false
        "instance_device:node_disk_io_time_weighted_seconds:rate5m":
          create: false
        "instance:node_network_receive_bytes_excluding_lo:rate5m":
          create: false
        "instance:node_network_transmit_bytes_excluding_lo:rate5m":
          create: false
        "instance:node_network_receive_drop_excluding_lo:rate5m":
          create: false
        "instance:node_network_transmit_drop_excluding_lo:rate5m":
          create: false
        "instance:node_network_receive_bytes_physical:rate5m":
          create: false
        "instance:node_network_transmit_bytes_physical:rate5m":
          create: false
        "instance:node_network_receive_drop_physical:rate5m":
          create: false
        "instance:node_network_transmit_drop_physical:rate5m":
          create: false
    grafana:
      image:
        registry: ghcr.io
        repository: vaskozl/grafana
        tag: 13.0.12@sha256:501b4e6c3aa0f01aeceea6bf63157c2e53c5f35c47171823ce2ce56921e016de
      route:
        main:
          enabled: true
          labels:
            agentgateway.sko.ai/auth: oauth2
          parentRefs:
            - name: internal
              namespace: agentgateway
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Server Monitoring Dashboards
            gethomepage.dev/group: Monitoring
            gethomepage.dev/icon: grafana
            gethomepage.dev/name: Grafana
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
          hostnames:
            - gf.sko.ai
      dashboardsConfigMaps:
        mixin: dashboards-mixin
        misc: dashboards-misc
        node-exporter: dashboards-node-exporter
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Editor
    alertmanager:
      route:
        extraLabels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        enabled: true
        hostnames:
          - am.sko.ai
      spec:
        externalURL: "https://am.sko.ai"
        image:
          repository: ghcr.io/vaskozl/prometheus-alertmanager
          tag: 0.35.0@sha256:1ffc19723f1986ee50283219389ee0d45689e60ed09d60832cfbc425d08f5853
      config:
        route:
          routes:
            # tmp: dotnet 6 sdk is no longer packaged
            - matchers:
                - alertgroup="container-vulns"
                - image="ghcr.io/vaskozl/sonarr:4.0.16@sha256:e84d53f89f4774dc62c2632300d31a3b40ff64e9c19b4f82825729ddf256830e"
              receiver: 'blackhole'
            # gitlab-sidekiq HPA is intentionally capped at 2 replicas; queueing
            # under sustained load is acceptable and not actionable.
            - matchers:
                - alertname="KubeHpaMaxedOut"
                - namespace="gitlab"
                - horizontalpodautoscaler="gitlab-sidekiq-all-in-1-v2"
              receiver: 'blackhole'
            - matchers:
                - severity=~"warning|critical"
              receiver: mail-monitoring
              repeat_interval: 24h
        receivers:
          - name: 'blackhole'
          - name: "mail-monitoring"
            email_configs:
              - to: alertmanager@sko.ai
                from: alertmanager@sko.ai
                hello: am.sko.ai
                smarthost: 'mx-maddy.mailserver.svc.cluster.local:2225'
                tls_config:
                  insecure_skip_verify: true
                send_resolved: true
                headers:
                  Subject: >
                    {{ if eq .Status "resolved" }}👌{{ end }} {{ if eq .Status "firing" }}🚨{{ end }} {{ index .CommonLabels.alertname
                    }}

                text: >
                  {{ range .Alerts }} {{ index .Annotations.description }} {{- end }}

                html: ''
    vmsingle:
      spec:
        nodeSelector:
          kubernetes.io/arch: arm64
        retentionPeriod: "3"
        storage:
          resources:
            requests:
              storage: 22Gi
        resources:
          limits:
            memory: 1.2Gi
          requests:
            cpu: 300m
            memory: 1.2Gi
      route:
        enabled: true
        extraLabels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Server Metrics
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: victoriametrics
          gethomepage.dev/name: VictoriaMetrics
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=vmsingle"
        hostnames:
          - vm.sko.ai
    vmalert:
      route:
        enabled: true
        extraLabels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        hostnames:
          - va.sko.ai
    vmagent:
      spec:
        inlineScrapeConfig: |
          - job_name: "syno"
            static_configs:
            - targets: ["syno:9100"]
          - job_name: "pinewall"
            static_configs:
            - targets: ["pinewall:9100"]
          - job_name: "blocky"
            static_configs:
            - targets: ["pinewall:4000"]
        # Unqueried since stats tracking began (2026-06-30) and exported by several jobs.
        inlineRelabelConfig:
          - action: drop
            sourceLabels: [__name__, is_set]
            regex: flag;false
          - action: drop
            sourceLabels: [__name__]
            regex: agentgateway_(request|response)_processing_seconds_bucket|controller_runtime_reconcile_time_seconds_bucket|grafana_feature_toggles_info|workqueue_queue_duration_seconds_bucket
        externalLabels:
          cluster: pi-cluster
        resources:
          limits:
            cpu: 1
            memory: 500Mi
          requests:
            cpu: 150m
            memory: 100Mi
      route:
        enabled: true
        hostnames:
          - vma.sko.ai
    kube-state-metrics:
      metricDenylist:
        - kube_pod_tolerations
        - kube_replicaset_status_(fully_labeled|ready|terminating)_replicas
        - kube_replicaset_status_observed_generation
    kubelet:
      vmScrape:
        spec:
          # Node labels minus the Talos extension versions, which would recreate
          # every kubelet series on each Talos upgrade, and copies of `node`.
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: extensions_talos_dev_.+|beta_kubernetes_io_.+|kubernetes_io_(hostname|os)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
          # Every pod brings its own set of cAdvisor series, so each dropped
          # container_* metric also cuts churn from CI and agent pods.
          metricRelabelConfigs:
            # container_spec_* overlaps with kube-state-metrics.
            - action: drop
              sourceLabels: [__name__]
              regex: >-
                container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)|container_memory_(events_high_total|failcnt|failures_total|file_dirty_bytes|file_writeback_bytes|mapped_file|pgscan_total|pgsteal_total|swap|total_inactive_file_bytes|usage_bytes|workingset_refault_file_total)|container_(creation_time_seconds|file_descriptors|last_seen|start_time_seconds|tasks_state|threads_max|ulimits_soft)|container_swap_(limit|usage)_bytes|container_network_(receive|transmit)_errors_total|container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)|container_blkio_device_usage_total|container_spec_.+|(csi_operations_seconds|kubelet_runtime_operations_duration_seconds|prober_probe_duration_seconds|rest_client_rate_limiter_duration_seconds|rest_client_request_size_bytes|storage_operation_duration_seconds|volume_operation_total_seconds)_bucket|rest_client_request_duration_seconds_(bucket|sum|count)
            # cgroups without a pod; must run before `id` is dropped below.
            - action: drop
              sourceLabels: [id, pod]
              regex: '.+;'
            - action: labeldrop
              regex: uid|id|name|pod_uid|interface
    # Not by most graphs or often useful
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeApiServer:
      enabled: false
    prometheus-node-exporter:
      image:
        registry: ghcr.io
        repository: vaskozl/prometheus-node-exporter
        # Keep digest out of `tag` — the subchart's daemonset.yaml runs
        # `semverCompare ">=1.4.0-0" .Values.image.tag` and chokes on `@sha256:`.
        tag: 1.12.1
        digest: sha256:4414556922bcfda0f1bdfbb5fd6a477792fd494a1caf16931c9562c047d13213
      extraArgs:
        - --collector.disable-defaults
        - --collector.uname
        - --collector.cpu
        - --collector.meminfo
        - --collector.nfs
