# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  interval: 24h
  chart:
    spec:
      chart: gitlab
      version: 10.4.1
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 24h
  values:
    global:
      extraEnv:
        GITLAB_LOG_LEVEL: 'error'
        GITLAB_LOGGER_TRUNCATE_LOGS: true
      nodeSelector:
        kubernetes.io/arch: amd64
      edition: ce
      hosts:
        domain: sko.ai
      ingress:
        enabled: false
        configureCertmanager: false
      gatewayApi:
        enabled: false
        configureCertmanager: false
        installEnvoy: false
      kas:
        enabled: false
      pages:
        enabled: false
      email:
        display_name: 'GitLab'
        from: 'gitlab@sko.ai'
        reply_to: 'noreply@sko.ai'
      smtp:
        enabled: true
        address: 'mail.sko.ai'
        port: 2225
        tls: false
        authentication: ''
      redis:
        host: gitlab-redis
        auth:
          secret: gitlab-redis-secret
          key: secret
      psql:
        host: gitlab-postgresql
        password:
          secret: gitlab-postgresql-password
          key: postgresql-password
      minio:
        enabled: false
      appConfig:
        omniauth:
          enabled: true
          autoSignInWithProvider: []
          syncProfileFromProvider: [openid_connect]
          allowSingleSignOn: [openid_connect]
          allowBypassTwoFactor: [openid_connect]
          syncProfileAttributes: [email]
          blockAutoCreatedUsers: false
          providers:
            - secret: pi-oauth2
        lfs: &rails
          connection:
            secret: object-storage
            key: rails.minio.yaml
        artifacts: *rails
        uploads: *rails
        packages: *rails
        externalDiffs: *rails
        terraformState: *rails
        dependencyProxy: *rails
        ciSecureFiles: *rails
    # Reduce memory usage
    gitlab:
      gitlab-exporter:
        enabled: false
      gitaly:
        # Reuse packfiles across repeated CI clones of the same commit.
        packObjectsCache:
          enabled: true
        resources:
          requests:
            cpu: 80m
            memory: 400M
          limits:
            memory: 660M
      webservice:
        minReplicas: 1
        maxReplicas: 1
        # Puma single mode: no idle master process alongside a lone worker.
        workerProcesses: 0
        resources:
          limits:
            memory: 2560Mi
          requests:
            # CFS weight comes from the request: at 100m puma was starved
            # whenever the node saturated and got SIGKILLed mid-shutdown.
            cpu: 1
            memory: 2560Mi
        workhorse:
          readinessProbe:
            timeoutSeconds: 5
        deployment:
          # Only 4 Puma threads per pod: a burst of concurrent requests queues
          # /-/readiness behind real traffic, so allow more headroom than the
          # chart default of 2s before pulling the pod from the Service. The
          # workhorse and sidekiq probes are widened for the same reason.
          readinessProbe:
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Cold boot measured at ~4min, above the liveness budget. Unlike the
          # liveness/readiness probes, the chart renders this block verbatim.
          startupProbe:
            httpGet:
              path: /-/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 40
      sidekiq:
        minReplicas: 1
        # robinsons is the only amd64 node; a second 1300Mi replica has nowhere
        # else to land and starves runner job pods.
        maxReplicas: 1
        resources:
          limits:
            memory: 1750Mi
          requests:
            cpu: 500m
            memory: 1300Mi
        readinessProbe:
          timeoutSeconds: 5
      gitlab-shell:
        minReplicas: 1
        maxReplicas: 2
        sshDaemon: gitlab-sshd
        config:
          lfs:
            pureSSHProtocol: true
      toolbox:
        resources:
          requests:
            cpu: 50m
            memory: 64M
          limits:
            memory: 350M
        backups:
          objectStorage:
            config:
              secret: object-storage
              key: toolbox.minio.toml
    registry:
      storage:
        secret: object-storage
        key: registry.minio.yaml
    # Disable things we handle by ourselves
    installCertmanager: false
    nginx-ingress:
      enabled: false
    prometheus:
      install: false
    grafana:
      enabled: false
    gitlab-runner:
      install: false
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: dummy-app
              spec:
                template:
                  spec:
                    nodeSelector:
                      kubernetes.io/arch: amd64
            target:
              kind: Deployment
          - patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: dummy-app
              spec:
                template:
                  spec:
                    nodeSelector:
                      kubernetes.io/arch: amd64
            target:
              kind: StatefulSet
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gitlab-registry
              spec:
                template:
                  spec:
                    containers:
                      - name: registry
                        env:
                          - name: REGISTRY_STORAGE_S3_MULTIPARTCOPYTHRESHOLDSIZE
                            value: "1073741824"
            target:
              kind: Deployment
              name: gitlab-registry
          # A pod sandbox restart re-runs init containers against the surviving
          # emptyDir, where the chart's plain cp cannot overwrite the 0440
          # secrets it left behind. -f matches the other components' scripts.
          - patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: gitlab-gitaly
              data:
                configure: |
                  set -e
                  mkdir -p /init-secrets/gitaly /init-secrets/shell
                  cp -f -v -r -L /init-config/.gitlab_shell_secret  /init-secrets/shell/.gitlab_shell_secret
                  cp -f -v -r -L /init-config/gitaly_token  /init-secrets/gitaly/gitaly_token
            target:
              kind: ConfigMap
              name: gitlab-gitaly
