# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/cronjob-batch-v1.json

apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-registry-garbage-collect
  namespace: gitlab
spec:
  schedule: "0 5 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: gitlab-registry-serviceaccount
          containers:
            - name: kubectl-exec
              image: ghcr.io/vaskozl/kubectl:1.37@sha256:5723ac61c3fc2b93bc1422ce59870810f187337862bd2d632e1a173fa2280e2d
              command:
                - "kubectl"
                - "exec"
                - "deploy/gitlab-registry"
                - "--namespace=gitlab"
                - "--"
                - "registry"
                - "garbage-collect"
                - "--delete-untagged"
                - "/etc/docker/registry/config.yml"
            # Job pods orphaned by a runner manager restart are never reaped by the runner.
            - name: delete-failed-runner-pods
              image: ghcr.io/vaskozl/kubectl:1.37@sha256:5723ac61c3fc2b93bc1422ce59870810f187337862bd2d632e1a173fa2280e2d
              args:
                - delete
                - pod
                - --namespace=gitlab
                - --selector=job.runner.gitlab.com/pod
                - --field-selector=status.phase=Failed
          restartPolicy: OnFailure
