# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkitd-arm64
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      buildkitd-arm64:
        containers:
          app:
            # A privileged container shares the host cgroupns, so buildkit would
            # parent executors at the host root, outside the pod's limits.
            command:
              - /bin/sh
              - -c
              - |
                printf '[worker.oci]\n  defaultCgroupParent = "%s"\n' "$(dirname "$(cut -d: -f3 /proc/self/cgroup)")" > /tmp/buildkitd.toml
                exec buildkitd --config /tmp/buildkitd.toml "$@"
              - buildkitd
            args:
              - --root
              - /cache
              - --addr
              - unix:///run/buildkit/buildkitd.sock
              - --addr
              - tcp://0.0.0.0:1234
              - --tlscacert
              - /certs/ca.pem
              - --tlscert
              - /certs/cert.pem
              - --tlskey
              - /certs/key.pem
            image:
              repository: ghcr.io/vaskozl/buildkitd
              tag: 0.34.1@sha256:0ac7f5772934fb13cb7fafde055f228f2e494d39f4e0260b3af2262ebfb802c1
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              limits:
                cpu: 2
                memory: 1.6Gi
              requests:
                cpu: 200m
                ephemeral-storage: 10Gi
                memory: 1.6Gi
            securityContext:
              privileged: true
        # buildkitd finishes in-flight builds on SIGTERM; surge so new builds
        # land on the new pod meanwhile.
        strategy: RollingUpdate
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: arm64
        node-role.kubernetes.io/control-plane: ''
      terminationGracePeriodSeconds: 3600
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
    persistence:
      cache:
        type: emptyDir
      certs:
        globalMounts:
          - path: /certs
        name: buildkit-daemon-certs
        type: secret
    service:
      app:
        controller: buildkitd-arm64
        ports:
          mtls:
            enabled: true
            port: 1234
