# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkitd-amd64
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.0.1
  values:
    controllers:
      buildkitd-amd64:
        containers:
          app:
            args:
              - --root
              - /cache
              - --addr
              - unix:///run/buildkit/buildkitd.sock
              - --addr
              - tcp://0.0.0.0:1234
              - --tlscacert
              - /certs/ca.pem
              - --tlscert
              - /certs/cert.pem
              - --tlskey
              - /certs/key.pem
              # Build executors run outside the pod cgroup, so the CPU limit does
              # not bound them. Gate steps here instead: one rekon test build fans
              # out ~10 `go test` stages that would otherwise all land at once.
              - --oci-max-parallelism
              - "4"
            image:
              repository: ghcr.io/vaskozl/buildkitd
              tag: 0.33.0@sha256:7c8f8252676a9afffb73511410e9fc234c6e918c965609d5c1b5e882203d1e7b
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              limits:
                cpu: 2
                memory: 4Gi
              requests:
                cpu: 200m
                ephemeral-storage: 10Gi
                memory: 1Gi
            securityContext:
              privileged: true
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      cache:
        type: emptyDir
      certs:
        globalMounts:
          - path: /certs
        name: buildkit-daemon-certs
        type: secret
    service:
      app:
        controller: buildkitd-amd64
        ports:
          mtls:
            enabled: true
            port: 1234
