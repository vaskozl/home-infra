# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkitd-amd64
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      buildkitd-amd64:
        containers:
          app:
            # A privileged container shares the host cgroupns, so buildkit would
            # parent executors at the host root, outside the pod's limits.
            command:
              - /bin/sh
              - -c
              - |
                printf '[worker.oci]\n  defaultCgroupParent = "%s"\n' "$(dirname "$(cut -d: -f3 /proc/self/cgroup)")" > /tmp/buildkitd.toml
                exec buildkitd --config /tmp/buildkitd.toml "$@"
              - buildkitd
            args:
              - --root
              - /cache
              - --addr
              - unix:///run/buildkit/buildkitd.sock
              - --addr
              - tcp://0.0.0.0:1234
              - --tlscacert
              - /certs/ca.pem
              - --tlscert
              - /certs/cert.pem
              - --tlskey
              - /certs/key.pem
              # One rekon test build fans out ~10 `go test` stages; running them
              # all at once would blow past the memory limit.
              - --oci-max-parallelism
              - "4"
            image:
              repository: ghcr.io/vaskozl/buildkitd
              tag: 0.34.1@sha256:06aa4203489fe687162b483c0d5b79423e2ca5033afcef7c1648e84ad496b76b
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              # No CPU limit: builds use 7-9 cores and throttling would stall CI.
              limits:
                memory: 12Gi
              requests:
                cpu: 1
                ephemeral-storage: 10Gi
                memory: 2Gi
            securityContext:
              privileged: true
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      cache:
        type: emptyDir
      certs:
        globalMounts:
          - path: /certs
        name: buildkit-daemon-certs
        type: secret
    service:
      app:
        controller: buildkitd-amd64
        ports:
          mtls:
            enabled: true
            port: 1234
