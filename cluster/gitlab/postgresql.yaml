# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-postgresql
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      main:
        containers:
          app:
            env:
              POSTGRES_USER: postgres
              POSTGRES_DB: gitlabhq_production
              POSTGRES_PASSWORD:
                secretKeyRef:
                  name: gitlab-postgresql-password
                  key: postgresql-postgres-password
            image:
              repository: pgautoupgrade/pgautoupgrade
              tag: 17.11-debian@sha256:a7af58a91ebdee5a70c711f5992e06e2bf6cbed422b4dcf0d1758ea99c78c848
            probes:
              # Generous liveness margin: a saturated node makes pg_isready slow,
              # and restarting postgres never fixes an I/O stall.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, gitlab, -d, gitlabhq_production]
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, gitlab, -d, gitlabhq_production]
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, gitlab, -d, gitlabhq_production]
                  timeoutSeconds: 5
                  periodSeconds: 30
                  failureThreshold: 120
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 768Mi
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /var/lib/postgresql/data
                  subPath: data
              name: data
              size: 8Gi
        type: statefulset
    defaultPodOptions:
      # Only GitLab component not pinned to amd64: arm64 CI builds saturate Pi I/O.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsUser: 70
        runAsNonRoot: true
    service:
      main:
        controller: main
        ports:
          postgresql:
            port: 5432
