# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-redis
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      main:
        containers:
          app:
            envFrom:
              - secretRef:
                 name: gitlab-redis-secret
            args: ["--requirepass", "$(secret)"]
            image:
              repository: ghcr.io/vaskozl/redis
              tag: 8.10.3@sha256:4343028a6b4a59d09782048d1283bd48a59962b1330156d8756dbd80ae4b2430
            probes:
              # Wide margin: a restart never fixes an I/O stall on a busy node.
              liveness:
                enabled: true
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              limits:
                memory: 250Mi
              requests:
                cpu: 10m
                memory: 64Mi
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
