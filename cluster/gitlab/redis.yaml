# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-redis
  annotations:
    patch.sko.ai/app-template: common
spec:
  interval: 24h
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      main:
        containers:
          app:
            envFrom:
              - secretRef:
                 name: gitlab-redis-secret
            # sidekiq-cron only registers jobs at boot: losing redis stops pipeline schedules.
            args: ["--requirepass", "$(secret)", "--appendonly", "yes", "--save", ""]
            image:
              repository: ghcr.io/vaskozl/redis
              tag: 8.10.3@sha256:7853bea45ae4b7eba2b99dd93b44ae1450bcb12a680c680aa1d6ed41947c8090
            probes:
              # Wide margin: a restart never fixes an I/O stall on a busy node.
              liveness:
                enabled: true
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              limits:
                memory: 250Mi
              requests:
                cpu: 10m
                memory: 64Mi
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
    defaultPodOptions:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
    # A standalone PVC: volumeClaimTemplates are immutable on the existing StatefulSet.
    persistence:
      data:
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data
        size: 1Gi
        type: persistentVolumeClaim
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
