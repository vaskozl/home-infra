apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-pod-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-pod-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-pod-cleanup
subjects:
  - kind: ServiceAccount
    name: runner-pod-cleanup
    namespace: gitlab
