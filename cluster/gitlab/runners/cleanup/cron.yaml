# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runner-pod-cleanup
spec:
  concurrencyPolicy: Forbid
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: runner-pod-cleanup
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: ghcr.io/vaskozl/kubectl:1.35@sha256:627bbff5f0bb2fd0e6c23b50bde9c0645519ab23a98b05f01f054bd8ed892941
              # Job pods orphaned by a manager restart are never reaped by the runner.
              args:
                - delete
                - pod
                - --namespace=gitlab
                - --selector=job.runner.gitlab.com/pod
                - --field-selector=status.phase=Failed
