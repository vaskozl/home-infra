# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-amd64
  namespace: gitlab
spec:
  interval: 24h
  chart:
    spec:
      chart: gitlab-runner
      version: 0.94.2
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 24h
  values:
    gitlabUrl: https://gitlab.sko.ai
    concurrent: 2
    rbac:
      create: true
    serviceAccount:
      create: true
    # check-live runs `gitlab-runner verify` against GitLab and fails hard on a
    # 503, so the default 3x60s kills a healthy manager (and orphans its jobs)
    # during any GitLab restart. The runner itself rides out an outage; GitLab
    # only fails a silent job after 1h, so tolerate the same.
    livenessProbe:
      failureThreshold: 60
    # SIGTERM makes the runner abort its jobs; SIGQUIT drains them. A rollout
    # therefore sends SIGQUIT and waits, instead of the chart's default preStop
    # that unregisters the manager mid-job.
    unregisterRunners: false
    shutdown_timeout: 3500
    terminationGracePeriodSeconds: 3600
    deploymentLifecycle:
      preStop:
        exec:
          command: ["/bin/bash", "-c", "kill -QUIT 1; while kill -0 1 2>/dev/null; do sleep 1; done"]
    runners:
      secret: amd64-gitlab-runner-secret
      runUntagged: true
      tags: [amd64]
      nodeSelector:
        kubernetes.io/arch: amd64
      config: |
        [[runners]]
          [runners.kubernetes]
            helper_image = "ghcr.io/vaskozl/gitlab-runner-helper:latest"
            pull_policy = ["always", "if-not-present"]
            cpu_request = "500m"
            cpu_limit = "1"
            cpu_limit_overwrite_max_allowed = "12"
            cpu_request_overwrite_max_allowed = "4"
            memory_request = "2Gi"
            memory_limit = "4Gi"
            memory_request_overwrite_max_allowed = "6Gi"
            memory_limit_overwrite_max_allowed = "8Gi"
            service_cpu_request = "100m"
            service_cpu_limit = "1"
            service_memory_request = "50Mi"
            service_memory_limit = "1Gi"
            helper_cpu_request = "5m"
            helper_cpu_limit = "500m"
            helper_memory_request = "50Mi"
            helper_memory_limit = "200Mi"
            poll_interval = 5
            poll_timeout = 3600
            priority_class_name = "batch"
            # Used by bubblewrap
            cap_add = ["NET_ADMIN", "SYS_ADMIN"]
            [[runners.kubernetes.volumes.empty_dir]]
              name = "docker-emptydir"
              mount_path = "/var/run"
              medium = "Memory"
            [[runners.kubernetes.volumes.pvc]]
              name = "apk-repo-pvc"
              mount_path = "/apks"
            # Without a distributed cache the runner keeps `cache:` archives in /cache.
            [[runners.kubernetes.volumes.pvc]]
              name = "runner-cache-pvc"
              mount_path = "/cache"
            [runners.kubernetes.node_selector]
              "kubernetes.io/arch" = "amd64"
    image:
      registry: ghcr.io
      image: vaskozl/gitlab-runner
      repository: vaskozl/gitlab-runner
      tag: 19.3.3@sha256:7c213d18869bfa803b32a2e00af3638ac34bbc005f73519e840877c764b75397
