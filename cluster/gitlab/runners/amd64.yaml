# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner-amd64
  namespace: gitlab
spec:
  interval: 24h
  chart:
    spec:
      chart: gitlab-runner
      version: 0.90.1
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 24h
  values:
    gitlabUrl: https://gitlab.sko.ai
    concurrent: 1
    rbac:
      create: true
    serviceAccount:
      create: true
    runners:
      secret: amd64-gitlab-runner-secret
      runUntagged: true
      tags: [amd64]
      nodeSelector:
        kubernetes.io/arch: amd64
      config: |
        [[runners]]
          [runners.kubernetes]
            helper_image = "ghcr.io/vaskozl/gitlab-runner-helper:latest"
            cpu_request = "500m"
            cpu_limit = "1"
            memory_request = "256Mi"
            memory_limit = "8Gi"
            service_cpu_request = "100m"
            service_cpu_limit = "1"
            service_memory_request = "50Mi"
            service_memory_limit = "1Gi"
            helper_cpu_request = "5m"
            helper_cpu_limit = "500m"
            helper_memory_request = "50Mi"
            helper_memory_limit = "200Mi"
            # NET_ADMIN and SYS_ADMIN are used by bubblewrap; the rest is the
            # container runtime default set that apk/abuild rely on as root.
            cap_drop = ["ALL"]
            cap_add = ["NET_ADMIN", "SYS_ADMIN", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "SETGID", "SETUID", "SETPCAP", "KILL", "AUDIT_WRITE", "SYS_CHROOT", "NET_BIND_SERVICE", "MKNOD"]
            [[runners.kubernetes.volumes.empty_dir]]
              name = "docker-emptydir"
              mount_path = "/var/run"
              medium = "Memory"
            [[runners.kubernetes.volumes.pvc]]
              name = "apk-repo-pvc"
              mount_path = "/apks"
            [runners.kubernetes.node_selector]
              "kubernetes.io/arch" = "amd64"
    image:
      registry: ghcr.io
      image: vaskozl/gitlab-runner
      repository: vaskozl/gitlab-runner
      tag: 19.2.1@sha256:7dcd8994841da3ca21bca5f8f10d25be9bbef964b47ac97723d1188179eb0dc7
