apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: oauth2-proxy-backend
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: oauth2-proxy
  backend:
    # agentgateway <=1.3.1 defaults ext_authz calls to 200ms, below the Linux
    # minimum TCP retransmit timeout: a single lost packet fails closed as a 403.
    http:
      requestTimeout: 5s
