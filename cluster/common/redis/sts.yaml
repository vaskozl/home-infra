apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  template:
    spec:
      serviceAccountName: redis
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/instance: redis
      securityContext:
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
        - name: sentinel
          image: &image ghcr.io/vaskozl/redis:8.8.2@sha256:bd44f97718cfb34f15e35fce99eec6d2aeaa608674889c4adc3ec4aad56c3de8
          restartPolicy: Always
          command: ["/usr/local/bin/sentinel.sh"]
          env: &env
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: redis
                  resource: limits.memory
          ports:
            - name: sentinel
              containerPort: 26379
          startupProbe:
            tcpSocket:
              port: sentinel
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 20Mi
          volumeMounts: &mounts
            - name: data
              mountPath: /var/lib/redis
            - name: usr-local-bin
              mountPath: /usr/local/bin
            - name: run-redis
              mountPath: /run/redis
        - name: labeler
          image: ghcr.io/vaskozl/kubectl:1.35@sha256:02de308bf81ebd14b8dd59b33bd30bdf4d178144f1c6a36ae0fc380c5383d7c5
          restartPolicy: Always
          command: ["/usr/local/bin/update-master-label.sh"]
          env: *env
          readinessProbe:
            exec:
              command: ["test", "-e", "/proc/1/fd/3"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: usr-local-bin
              mountPath: /usr/local/bin
            - name: run-redis
              mountPath: /run/redis
      containers:
        - name: redis
          image: *image
          command: ["/usr/local/bin/redis.sh"]
          env: *env
          lifecycle:
            preStop:
              exec:
                command: ["/usr/local/bin/prestop.sh"]
          ports:
            - name: tcp
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/ready.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts: *mounts
      volumes:
        - name: run-redis
          emptyDir: {}
        - name: usr-local-bin
          configMap:
            name: redis-scripts
            defaultMode: 0555
