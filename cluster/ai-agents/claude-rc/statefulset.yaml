# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/statefulset-apps-v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude-rc
spec:
  template:
    spec:
      serviceAccountName: rekon-agent
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: claude
          image: registry.sko.ai/doudous/rekon/agent:0.0.102@sha256:3125d640dc7f0897de6597c9fb04bd3571e6191836a00558c53c768e0a7f7a89
          command: [claude]
          args: [--dangerously-skip-permissions, remote-control]
          workingDir: /home/nonroot/code
          envFrom:
            - configMapRef:
                name: agent-env
          env:
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: ""
            - name: PGSTORE_TEST_DSN
              value: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
            - name: GITLAB_TOKEN
              valueFrom: {secretKeyRef: {name: rekon-env, key: GITLAB_TOKEN}}
            - name: GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: rekon-env, key: GITHUB_TOKEN}}
          resources:
            limits:
              cpu: 8
              memory: 16Gi
            requests:
              cpu: 10m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: rekon-home
              mountPath: /home/nonroot
            - name: config
              mountPath: /etc/claude-code/CLAUDE.md
              subPath: CLAUDE.md
            - name: config
              mountPath: /etc/claude-code/managed-mcp.json
              subPath: managed-mcp.json
            - name: config
              mountPath: /etc/claude-code/managed-settings.json
              subPath: managed-settings.json
            - name: screenshots
              mountPath: /tmp/screenshots
      initContainers:
        - name: testdb
          restartPolicy: Always
          image: ghcr.io/vaskozl/postgresql:18.7@sha256:317b406a806dfbd70aa2435290612dd39bf1df26529507d59490f853b1972e9d
          env:
            - name: PGPORT
              value: "15432"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          args:
            - -c
            - listen_addresses=127.0.0.1
            - -c
            - max_connections=500
            - -c
            - fsync=off
            - -c
            - synchronous_commit=off
            - -c
            - full_page_writes=off
            - -c
            - idle_in_transaction_session_timeout=60s
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
          volumeMounts:
            - name: rekon-home
              mountPath: /home/nonroot
        - name: chromium
          restartPolicy: Always
          image: ghcr.io/vaskozl/chromium:158.0.8127.88@sha256:f9d07d29664b1d59a89a18b458208ea05a0e2e166736eed6342c5c12273633da
          args: [--headless, --remote-debugging-port=9222, --user-data-dir=/tmp/chrome]
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 500Mi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: rekon-home
              mountPath: /home/nonroot
            - name: screenshots
              mountPath: /tmp/screenshots
        - name: chrome-devtools-mcp
          restartPolicy: Always
          image: ghcr.io/vaskozl/node:latest@sha256:1b4930b123c0615f066f24597d971fb95f8cf97e42291d3713ef8ea152c8f932
          command: ["npx"]
          args:
            - -y
            - mcp-proxy@6.5.1
            - --transport
            - streamablehttp
            - --port
            - "9223"
            - --
            - npx
            - -y
            - chrome-devtools-mcp@1.1.1
            - --browserUrl=http://127.0.0.1:9222
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 600Mi
          volumeMounts:
            - name: rekon-home
              mountPath: /home/nonroot
            - name: screenshots
              mountPath: /tmp/screenshots
      volumes:
        - name: rekon-home
          persistentVolumeClaim:
            claimName: rekon-home
        - name: config
          secret:
            secretName: config
        - name: screenshots
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
