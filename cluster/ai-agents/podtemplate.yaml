# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/podtemplate-v1.json
apiVersion: v1
kind: PodTemplate
metadata:
  name: rekon-agent-turn
  namespace: ai-agents
template:
  metadata:
    labels:
      app.kubernetes.io/name: rekon-agent
  spec:
    priorityClassName: batch
    # Schedule on the pod total: its sidecars and agent do not peak together
    # (whole pod p90 4.3Gi, p99 7.1Gi vs 6.3Gi of summed container requests),
    # so two turns fit next to rekon-0 on robinsons.
    resources:
      limits:
        memory: 7Gi
      requests:
        cpu: 600m
        memory: 4Gi
    serviceAccountName: rekon-agent
    enableServiceLinks: false
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    imagePullSecrets:
      - name: regcred
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: rekon
                app.kubernetes.io/controller: main
            namespaces: [ai]
            topologyKey: kubernetes.io/hostname
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    containers:
      - name: agent
        image: registry.sko.ai/doudous/rekon/pkgupdate:0.0.84@sha256:a841c1276fb3cff31b0fd0d5557f9479987947b32bdabe33b3b5b3586ddbd3ed
        envFrom:
          - configMapRef:
              name: agent-env
        env:
          - name: PGSTORE_TEST_DSN
            value: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
          - name: GITLAB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITLAB_TOKEN}}
          - name: GITHUB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITHUB_TOKEN}}
        resources:
          limits:
            cpu: 2
            memory: 6Gi
          requests:
            cpu: 400m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: config
            mountPath: /etc/claude-code/CLAUDE.md
            subPath: CLAUDE.md
          - name: config
            mountPath: /etc/claude-code/managed-mcp.json
            subPath: managed-mcp.json
          - name: screenshots
            mountPath: /tmp/screenshots
    initContainers:
      - name: testdb
        restartPolicy: Always
        image: ghcr.io/vaskozl/postgresql:18.6@sha256:db1f32dc5aee052a6621cee65b867691ae813e21a3a42bf8204de5311710218a
        env:
          - name: PGPORT
            value: "15432"
          - name: POSTGRES_HOST_AUTH_METHOD
            value: trust
        args:
          - -c
          - listen_addresses=127.0.0.1
          - -c
          - max_connections=500
          - -c
          - fsync=off
          - -c
          - synchronous_commit=off
          - -c
          - full_page_writes=off
          - -c
          - idle_in_transaction_session_timeout=60s
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          runAsNonRoot: true
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
      - name: chromium
        restartPolicy: Always
        image: ghcr.io/vaskozl/chromium:156.0.8078.79@sha256:2a615988b11f3dcd280d4efde4611b51946607eb2fed0bbe82a712ecf392ff73
        args: [--headless, --remote-debugging-port=9222, --user-data-dir=/tmp/chrome]
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
      - name: chrome-devtools-mcp
        restartPolicy: Always
        image: ghcr.io/vaskozl/node:latest@sha256:187a227cead5a1148269519ed77d33308ae1b9677e8b2306cf55d58b7e43a995
        command: ["npx"]
        args:
          - -y
          - mcp-proxy@6.5.1
          - --transport
          - streamablehttp
          - --port
          - "9223"
          - --
          - npx
          - -y
          - chrome-devtools-mcp@1.1.1
          - --browserUrl=http://127.0.0.1:9222
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 600Mi
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
    volumes:
      - name: rekon-home
        persistentVolumeClaim:
          claimName: rekon-home
      - name: config
        secret:
          secretName: config
      - name: screenshots
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
