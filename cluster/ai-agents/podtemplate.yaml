# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/podtemplate-v1.json
apiVersion: v1
kind: PodTemplate
metadata:
  name: rekon-agent-turn
  namespace: ai-agents
template:
  metadata:
    labels:
      app.kubernetes.io/name: rekon-agent
  spec:
    priorityClassName: batch
    # Schedule on the pod total: its sidecars and agent do not peak together
    # (whole pod p90 4.3Gi, p99 7.1Gi vs 6.3Gi of summed container requests),
    # so two turns fit next to rekon-0 on robinsons.
    resources:
      limits:
        memory: 7Gi
      requests:
        cpu: 600m
        memory: 4Gi
    serviceAccountName: rekon-agent
    enableServiceLinks: false
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    imagePullSecrets:
      - name: regcred
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: rekon
                app.kubernetes.io/controller: main
            namespaces: [ai]
            topologyKey: kubernetes.io/hostname
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    containers:
      - name: agent
        image: registry.sko.ai/doudous/rekon/pkgupdate:0.0.84@sha256:84ab9efbdafaa427a628e17364fc0d58c0e43818c985184115236e9389d996b9
        envFrom:
          - configMapRef:
              name: agent-env
        env:
          - name: PGSTORE_TEST_DSN
            value: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
          - name: GITLAB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITLAB_TOKEN}}
          - name: GITHUB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITHUB_TOKEN}}
        resources:
          limits:
            cpu: 2
            memory: 6Gi
          requests:
            cpu: 400m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: config
            mountPath: /etc/claude-code/CLAUDE.md
            subPath: CLAUDE.md
          - name: config
            mountPath: /etc/claude-code/managed-mcp.json
            subPath: managed-mcp.json
          - name: screenshots
            mountPath: /tmp/screenshots
    initContainers:
      - name: testdb
        restartPolicy: Always
        image: ghcr.io/vaskozl/postgresql:18.6@sha256:12efdae428800e31fc42fd2d5bcad1101ec17d62c62262a3a66f23cc5732e76f
        env:
          - name: PGPORT
            value: "15432"
          - name: POSTGRES_HOST_AUTH_METHOD
            value: trust
        args:
          - -c
          - listen_addresses=127.0.0.1
          - -c
          - max_connections=500
          - -c
          - fsync=off
          - -c
          - synchronous_commit=off
          - -c
          - full_page_writes=off
          - -c
          - idle_in_transaction_session_timeout=60s
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          runAsNonRoot: true
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
      - name: chromium
        restartPolicy: Always
        image: ghcr.io/vaskozl/chromium:156.0.8078.79@sha256:375e4a8263fdcd6e693b5cd4ffb578adcdacb95a1b25a581379b019869f30b5d
        args: [--headless, --remote-debugging-port=9222, --user-data-dir=/tmp/chrome]
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
      - name: chrome-devtools-mcp
        restartPolicy: Always
        image: ghcr.io/vaskozl/node:latest@sha256:3b727242cf9aff97e14f6247720a38d4403b2a6b44f13b90cc3b48bd1ec1d796
        command: ["npx"]
        args:
          - -y
          - mcp-proxy@6.5.1
          - --transport
          - streamablehttp
          - --port
          - "9223"
          - --
          - npx
          - -y
          - chrome-devtools-mcp@1.1.1
          - --browserUrl=http://127.0.0.1:9222
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 600Mi
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
    volumes:
      - name: rekon-home
        persistentVolumeClaim:
          claimName: rekon-home
      - name: config
        secret:
          secretName: config
      - name: screenshots
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
