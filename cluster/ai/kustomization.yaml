# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - _namespace.yaml
  - ci-monitor
  - rekon
components:
  - ../common
patches:
  # Pods labelled netpol.sko.ai/namespace-ingress=false bring their own
  # same-namespace policy (rekon-postgres-ingress).
  - target:
      kind: NetworkPolicy
      name: allow-namespace-ingress
    patch: |
      - op: replace
        path: /spec/podSelector
        value:
          matchExpressions:
            - key: netpol.sko.ai/namespace-ingress
              operator: NotIn
              values: ["false"]
