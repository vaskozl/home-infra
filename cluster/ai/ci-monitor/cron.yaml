# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-monitor
spec:
  schedule: '*/20 * * * *'
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    metadata:
    spec:
      template:
        metadata:
        spec:
          containers:
            - args: [/script/ci-monitor.pl]
              image: ghcr.io/vaskozl/perl-mojolicious:9.49@sha256:9ba373bca25bdb1685e77a1d886fe7b4390d56835ba04c9b7f938f7dc7ee8c4a
              name: ci-monitor
              env:
                - name: GITLAB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: rekon-env
                      key: GITLAB_HOST
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: rekon-env
                      key: GITLAB_TOKEN
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - mountPath: /script
                  name: script
          restartPolicy: Never
          volumes:
            - configMap:
                defaultMode: 420
                name: ci-monitor-script
              name: script
