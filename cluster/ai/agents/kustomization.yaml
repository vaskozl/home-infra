# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-agents
resources:
  - _namespace.yaml
  - podtemplate.yaml
  - claude-rc
  - pvc.yaml
  - rbac.yaml
  - ../rekon/regcred.enc.yaml
components:
  - ../../common
configMapGenerator:
  - name: agent-env
    envs:
      - agent.env
secretGenerator:
  - name: rekon-env
    envs:
      - ../rekon/claude.enc.env
  - name: config
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - CLAUDE.md=../rekon/config/CLAUDE.md
      - managed-mcp.json=../rekon/config/managed-mcp.json
