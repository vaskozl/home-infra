# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/podtemplate-v1.json
apiVersion: v1
kind: PodTemplate
metadata:
  name: rekon-agent-turn
  namespace: ai-agents
template:
  metadata:
    labels:
      app.kubernetes.io/name: rekon-agent
  spec:
    serviceAccountName: rekon-agent
    enableServiceLinks: false
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    imagePullSecrets:
      - name: regcred
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: rekon
                app.kubernetes.io/controller: main
            namespaces: [ai]
            topologyKey: kubernetes.io/hostname
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    containers:
      - name: agent
        image: registry.sko.ai/doudous/rekon/pkgupdate:0.0.83@sha256:1fa8a672741244459a9d143d577971466b8521acecb007c3fe150f5c17d7bdc9
        env:
          - name: TMPDIR
            value: /tmp
          - name: DISABLE_TELEMETRY
            value: "1"
          - name: DISABLE_BUG_COMMAND
            value: "1"
          - name: DISABLE_AUTOUPDATER
            value: "1"
          - name: DISABLE_ERROR_REPORTING
            value: "1"
          - name: PGSTORE_TEST_DSN
            value: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
          # Only the agent's keys: AUTH_SECRET, OIDC_CLIENT_SECRET, SMTPHOST
          # and BASE_URL stay with the controller.
          - name: GITLAB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITLAB_TOKEN}}
          - name: GITLAB_HOST
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITLAB_HOST}}
          - name: GITHUB_TOKEN
            valueFrom: {secretKeyRef: {name: rekon-env, key: GITHUB_TOKEN}}
          - name: DO_NOT_TRACK
            valueFrom: {secretKeyRef: {name: rekon-env, key: DO_NOT_TRACK}}
          - name: CLAUDE_CODE_DISABLE_BACKGROUND_TASKS
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_DISABLE_BACKGROUND_TASKS}}
          - name: CLAUDE_CODE_DISABLE_CRON
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_DISABLE_CRON}}
          - name: CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS}}
          - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC}}
          - name: CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION}}
          - name: CLAUDE_CODE_ENABLE_TASKS
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_ENABLE_TASKS}}
          - name: CLAUDE_CODE_OAUTH_401_WAIT_MS
            valueFrom: {secretKeyRef: {name: rekon-env, key: CLAUDE_CODE_OAUTH_401_WAIT_MS}}
        resources:
          limits:
            cpu: 4
            memory: 8Gi
          requests:
            cpu: 400m
            memory: 2.5Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: config
            mountPath: /etc/claude-code/CLAUDE.md
            subPath: CLAUDE.md
          - name: config
            mountPath: /etc/claude-code/managed-mcp.json
            subPath: managed-mcp.json
          - name: screenshots
            mountPath: /tmp/screenshots
    initContainers:
      - name: testdb
        restartPolicy: Always
        image: ghcr.io/vaskozl/postgresql:18.6@sha256:13877919780c1f208b8fb8b14d5a40d942052a3a348f367a066fac097f767e89
        env:
          - name: PGPORT
            value: "15432"
          - name: POSTGRES_HOST_AUTH_METHOD
            value: trust
        args:
          - -c
          - listen_addresses=127.0.0.1
          - -c
          - max_connections=500
          - -c
          - fsync=off
          - -c
          - synchronous_commit=off
          - -c
          - full_page_writes=off
          - -c
          - idle_in_transaction_session_timeout=60s
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          runAsNonRoot: true
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
      - name: chromium
        restartPolicy: Always
        image: ghcr.io/vaskozl/chromium:156.0.8078.73@sha256:b63b1ef5018f743ce8c0d2e10153108da20a374fca8cf1fad3fb0f966a5bb01c
        args: [--headless, --remote-debugging-port=9222, --user-data-dir=/tmp/chrome]
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
      - name: chrome-devtools-mcp
        restartPolicy: Always
        image: ghcr.io/vaskozl/node:latest@sha256:db55573cd0dd6fd01b5573d92d95a080671ad089afb62dc382a38deea8dfa78e
        command: ["npx"]
        args:
          - -y
          - mcp-proxy@6.5.1
          - --transport
          - streamablehttp
          - --port
          - "9223"
          - --
          - npx
          - -y
          - chrome-devtools-mcp@1.1.1
          - --browserUrl=http://127.0.0.1:9222
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 600Mi
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
    volumes:
      - name: rekon-home
        persistentVolumeClaim:
          claimName: rekon-home
      - name: config
        secret:
          secretName: config
      - name: screenshots
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
