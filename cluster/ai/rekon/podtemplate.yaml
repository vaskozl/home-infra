# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/podtemplate-v1.json
apiVersion: v1
kind: PodTemplate
metadata:
  name: rekon-agent-turn
  namespace: ai
template:
  metadata:
    labels:
      app.kubernetes.io/name: rekon-agent
  spec:
    serviceAccountName: rekon-agent
    enableServiceLinks: false
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    imagePullSecrets:
      - name: regcred
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: rekon
                app.kubernetes.io/controller: main
            topologyKey: kubernetes.io/hostname
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    containers:
      - name: agent
        image: registry.sko.ai/doudous/rekon/pkgupdate:0.0.78@sha256:058a9839a5a16a79fdafd1ca00e179d1afed5e7a6f4158ee1e07be4e41492110
        env:
          - name: TMPDIR
            value: /tmp
          - name: DISABLE_TELEMETRY
            value: "1"
          - name: DISABLE_BUG_COMMAND
            value: "1"
          - name: DISABLE_AUTOUPDATER
            value: "1"
          - name: DISABLE_ERROR_REPORTING
            value: "1"
          - name: PGSTORE_TEST_DSN
            value: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
        envFrom:
          - secretRef:
              name: rekon-env
        resources:
          limits:
            cpu: 4
            memory: 14Gi
          requests:
            cpu: 400m
            memory: 3.2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: config
            mountPath: /home/nonroot/.claude/CLAUDE.md
            subPath: CLAUDE.md
          - name: screenshots
            mountPath: /tmp/screenshots
    initContainers:
      - name: testdb
        restartPolicy: Always
        image: ghcr.io/vaskozl/postgresql:18.6@sha256:a4284779780379c78a9e3d3a9c1e1f252891243f18eb30c2a3583a759e11677c
        env:
          - name: PGPORT
            value: "15432"
          - name: POSTGRES_HOST_AUTH_METHOD
            value: trust
        args:
          - -c
          - listen_addresses=127.0.0.1
          - -c
          - max_connections=500
          - -c
          - fsync=off
          - -c
          - synchronous_commit=off
          - -c
          - full_page_writes=off
          - -c
          - idle_in_transaction_session_timeout=60s
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          runAsNonRoot: true
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
      - name: chromium
        restartPolicy: Always
        image: ghcr.io/vaskozl/chromium:156.0.8078.47@sha256:ac1cb77b4f128741787d7d1126278aff952f520fe0c15feaf98d542c6a79e708
        args: [--headless, --remote-debugging-port=9222, --user-data-dir=/tmp/chrome]
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
      - name: chrome-devtools-mcp
        restartPolicy: Always
        image: ghcr.io/vaskozl/node:latest@sha256:09f7e05ece19f3b4524aee65382ad1d6127f740495e55c479e6ca2204860e39e
        command: ["npx"]
        args:
          - -y
          - mcp-proxy@6.5.1
          - --transport
          - streamablehttp
          - --port
          - "9223"
          - --
          - npx
          - -y
          - chrome-devtools-mcp@1.1.1
          - --browserUrl=http://127.0.0.1:9222
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 600Mi
        volumeMounts:
          - name: rekon-home
            mountPath: /home/nonroot
          - name: screenshots
            mountPath: /tmp/screenshots
    volumes:
      - name: rekon-home
        persistentVolumeClaim:
          claimName: rekon-home
      - name: config
        secret:
          secretName: config
      - name: screenshots
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
