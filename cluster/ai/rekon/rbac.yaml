apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rekon-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "persistentvolumes", "componentstatuses", "podtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ipaddresses", "servicecidrs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - admissionregistration.k8s.io
      - agentgateway.dev
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - certificates.k8s.io
      - coordination.k8s.io
      - eventing.keda.sh
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - keda.sh
      - node.k8s.io
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-readonly
subjects:
  - kind: ServiceAccount
    name: rekon
    namespace: ai
roleRef:
  kind: ClusterRole
  name: rekon-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-view
subjects:
  - kind: ServiceAccount
    name: rekon
    namespace: ai
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
