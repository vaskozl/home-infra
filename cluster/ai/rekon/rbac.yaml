apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rekon-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "persistentvolumes", "componentstatuses", "podtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ipaddresses", "servicecidrs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - admissionregistration.k8s.io
      - agentgateway.dev
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - certificates.k8s.io
      - coordination.k8s.io
      - eventing.keda.sh
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - keda.sh
      - node.k8s.io
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-readonly
subjects:
  - kind: ServiceAccount
    name: rekon
    namespace: ai
roleRef:
  kind: ClusterRole
  name: rekon-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-view
subjects:
  - kind: ServiceAccount
    name: rekon
    namespace: ai
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# The worker runs each agent turn as a pod built from the rekon-agent-turn
# PodTemplate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rekon-agent-turns
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["podtemplates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rekon-agent-turns
subjects:
  - kind: ServiceAccount
    name: rekon
    namespace: ai
roleRef:
  kind: Role
  name: rekon-agent-turns
  apiGroup: rbac.authorization.k8s.io
---
# Turn pods: the read-only cluster access the agent prompt promises, and no
# rights in ai beyond it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rekon-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-agent-readonly
subjects:
  - kind: ServiceAccount
    name: rekon-agent
    namespace: ai
roleRef:
  kind: ClusterRole
  name: rekon-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rekon-agent-view
subjects:
  - kind: ServiceAccount
    name: rekon-agent
    namespace: ai
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
