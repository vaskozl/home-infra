# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: rekon
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.0.1
  interval: 24h
  values:
    controllers:
      main:
        type: statefulset
        serviceAccount:
          identifier: rekon
        pod:
          hostUsers: false
          # Lets the app container see and SIGKILL chromium to get a fresh
          # browser per agent turn.
          shareProcessNamespace: true
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        initContainers:
          mcp-setup:
            image: &claudeImage
              repository: ghcr.io/vaskozl/claude
              tag: 2.1.231@sha256:78c80f6099015d0f743c6fd197b9315a062ac17cee3078877d75817dce544053
            command: ["sh", "-c"]
            args:
              - |
                mkdir -p /home/nonroot/.claude
                [ -f /home/nonroot/.claude/settings.json ] || cp /home/nonroot/config/claude-settings.json /home/nonroot/.claude/settings.json
                [ -f /home/nonroot/.claude/CLAUDE.md ] || cp /home/nonroot/config/CLAUDE.md /home/nonroot/.claude/CLAUDE.md
                claude mcp remove -s user victoriametrics 2>/dev/null
                claude mcp remove -s user chrome-devtools 2>/dev/null
                claude mcp add -s user --transport http victoriametrics http://mcp-victoriametrics.victoria-metrics.svc.cluster.local:8080/mcp
                claude mcp add -s user --transport http chrome-devtools http://127.0.0.1:8080/mcp
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/rekon-pkgupdate
              tag: 0.0.38@sha256:7df29e04d9ed4e66c502a1b87abd9c7e072ceb1f3ca7a7215548a5e40f62d848
            args:
              - -redis
              - redis-master:6379
              - -v
            env:
              DISABLE_TELEMETRY: "1"
              DISABLE_BUG_COMMAND: "1"
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
              OPERATOR_ORG: ujcwdrohelak # derived from Org spec.displayName "Doudous"
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                memory: 8Gi
              requests:
                cpu: 200m
                memory: 1Gi
            securityContext: *security-context
          chromium:
            image:
              repository: ghcr.io/vaskozl/chromium
              tag: 151.0.7922.75@sha256:c5d38b182cddc8e906ebfc10cf7f8a348b6f1d9b0926a3802290e52afb85347b
            # Respawn loop: killing the browser must not exit the container,
            # or the kubelet applies restart backoff. The profile dir is wiped
            # first so a SIGKILL leaves no stale SingletonLock or state.
            command: ["sh", "-c"]
            args:
              - |
                while true; do
                  rm -rf /tmp/chrome
                  chromium-browser --headless --remote-debugging-port=9222 --no-sandbox --user-data-dir=/tmp/chrome
                  sleep 1
                done
            resources:
              limits:
                memory: 1500Mi
              requests:
                cpu: 100m
                memory: 500Mi
          chrome-devtools-mcp:
            image:
              repository: cgr.dev/chainguard/node
              tag: latest@sha256:5280e63c3d2c81366056926b79f27f70e4adbd3a03a5b45c53503eac2b722b3f
            command: ["npx"]
            args:
              - -y
              - mcp-proxy@6.5.1
              - --transport
              - streamablehttp
              - --port
              - "8080"
              - --
              - npx
              - -y
              - chrome-devtools-mcp@1.1.1
              - --browserUrl=http://127.0.0.1:9222
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 600Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      config:
        type: secret
        name: config
        advancedMounts:
          main:
            app:
              - path: /home/nonroot/config
            mcp-setup:
              - path: /home/nonroot/config
      screenshots:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /tmp/screenshots
            chrome-devtools-mcp:
              - path: /tmp/screenshots
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
    route:
      app:
        hostnames:
          - rekon.sko.ai
        labels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8088
    service:
      app:
        controller: main
        ports:
          http:
            port: 8088
