# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: rekon
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext: &pod-security-context
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image: &appImage
              repository: registry.sko.ai/doudous/rekon/pkgupdate
              tag: 0.0.66@sha256:d47311ac8ba1bfdbd2dd085a56e2543ea3bb3e0480b53ffe68eb5f0c1ab4c4b9
            args:
              - -redis
              - rekon-redis:6379
              - -v
              - -mode
              - api
              - -prune-stale
              - -wait-replicas
              - "1"
            env: &env
              CONFIG_DIR: /home/nonroot/config
              # Agent turns override this with a private per-turn dir.
              TMPDIR: /tmp
              DISABLE_TELEMETRY: "1"
              DISABLE_BUG_COMMAND: "1"
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
              OPERATOR_ORG: Doudous
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        forceRename: rekon
        replicas: 2
        type: statefulset
        serviceAccount:
          identifier: rekon
        pod:
          hostUsers: false
          # Lets the app container see and SIGKILL chromium to get a fresh
          # browser per agent turn.
          shareProcessNamespace: true
          securityContext: *pod-security-context
          nodeSelector:
            kubernetes.io/arch: amd64
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            image: *appImage
            args:
              - -redis
              - rekon-redis:6379
              - -v
              - -mode
              - worker
            env: *env
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                cpu: 4
                memory: 14Gi
              requests:
                cpu: 400m
                memory: 3.2Gi
            securityContext: *security-context
          chromium:
            image:
              repository: ghcr.io/vaskozl/chromium
              tag: 153.0.8010.52@sha256:fc77d19c3d3c0df1ea50470152083d04d832b4c4e8bd2f266428fd5a8e989210
            # Respawn loop: killing the browser must not exit the container,
            # or the kubelet applies restart backoff. The profile dir is wiped
            # first so a SIGKILL leaves no stale SingletonLock or state.
            command: ["sh", "-c"]
            args:
              - |
                while true; do
                  rm -rf /tmp/chrome
                  chromium-browser --headless --remote-debugging-port=9222 --user-data-dir=/tmp/chrome
                  sleep 1
                done
            resources:
              limits:
                # Includes the /dev/shm tmpfs, charged to this cgroup.
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 500Mi
          chrome-devtools-mcp:
            image:
              repository: ghcr.io/vaskozl/node
              tag: latest@sha256:102a6853046429d145821b12e2d96a74a2f1672255f32b1f062b2e533cd896cf
            command: ["npx"]
            args:
              - -y
              - mcp-proxy@6.5.1
              - --transport
              - streamablehttp
              # Not 8080: agents boot the app under test on it, and mcp-proxy
              # binds :: in the pod's single network namespace.
              - --port
              - "9223"
              - --
              - npx
              - -y
              - chrome-devtools-mcp@1.1.1
              - --browserUrl=http://127.0.0.1:9222
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 600Mi
      redis:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/redstream
              tag: 0.0.4@sha256:58265cc7f3c9152419497999a15627c47490784e9c3c1416f23586be88b18bdb
            args: ['run', '--replica=s3://veroso-redis/rekon-v2', '--', '--bind', '*', '-::*', '--protected-mode', 'no']
            envFrom:
              - secretRef:
                  name: r2-credentials
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8081
                  periodSeconds: 1
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 32Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: regcred
    persistence:
      config:
        type: secret
        name: config
        advancedMounts:
          api:
            app:
              - path: /home/nonroot/config
          main:
            app:
              - path: /home/nonroot/config
              - path: /home/nonroot/.claude/CLAUDE.md
                subPath: CLAUDE.md
      screenshots:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /tmp/screenshots
            chrome-devtools-mcp:
              - path: /tmp/screenshots
            chromium:
              - path: /tmp/screenshots
      dshm:
        # The 64Mi default is too small for captureScreenshot: chromium backs
        # each CopyOutputResult bitmap with a file here and kills its GPU
        # process when the allocation fails.
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          main:
            chromium:
              - path: /dev/shm
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
    route:
      app:
        hostnames:
          - rekon.sko.ai
        labels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: rekon
        ports:
          http:
            port: 8080
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
