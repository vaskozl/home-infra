# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: rekon
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext: &pod-security-context
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image: &appImage
              repository: registry.sko.ai/doudous/rekon/pkgupdate
              tag: 0.0.73@sha256:b216f1724d3d26ce7b6473f8d0c021b127a3919a5071a1b6abae1cc3d971c4e2
            args:
              - -db
              - postgres://postgres@rekon-postgres/rekon?sslmode=disable
              - -config
              - /home/nonroot/config
              - -v
              - -mode
              - api
            env: &env
              # Agent turns override this with a private per-turn dir.
              TMPDIR: /tmp
              DISABLE_TELEMETRY: "1"
              DISABLE_BUG_COMMAND: "1"
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        forceRename: rekon
        replicas: 1
        type: statefulset
        serviceAccount:
          identifier: rekon
        pod:
          hostUsers: false
          # Lets the app container see and SIGKILL chromium to get a fresh
          # browser per agent turn.
          shareProcessNamespace: true
          securityContext: *pod-security-context
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            image: *appImage
            args:
              - -db
              - postgres://postgres@rekon-postgres/rekon?sslmode=disable
              - -config
              - /home/nonroot/config
              - -v
              - -mode
              - worker
            env: *env
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                cpu: 4
                memory: 14Gi
              requests:
                cpu: 400m
                memory: 3.2Gi
            securityContext: *security-context
          chromium:
            image:
              repository: ghcr.io/vaskozl/chromium
              tag: 155.0.8059.84@sha256:5c57a5c2b6b15c9ec05f06caff7d4aed17bded1618ccbaca2c46033fbcd74e67
            # Respawn loop: killing the browser must not exit the container,
            # or the kubelet applies restart backoff. The profile dir is wiped
            # first so a SIGKILL leaves no stale SingletonLock or state.
            command: ["sh", "-c"]
            args:
              - |
                while true; do
                  rm -rf /tmp/chrome
                  chromium-browser --headless --remote-debugging-port=9222 --user-data-dir=/tmp/chrome
                  sleep 1
                done
            resources:
              limits:
                # Includes the /dev/shm tmpfs, charged to this cgroup.
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 500Mi
          chrome-devtools-mcp:
            image:
              repository: ghcr.io/vaskozl/node
              tag: latest@sha256:cdd3f1388fc1da8318ce0a496163aa6385a52f4e013e61baacd0f737bd0aa269
            command: ["npx"]
            args:
              - -y
              - mcp-proxy@6.5.1
              - --transport
              - streamablehttp
              # Not 8080: agents boot the app under test on it, and mcp-proxy
              # binds :: in the pod's single network namespace.
              - --port
              - "9223"
              - --
              - npx
              - -y
              - chrome-devtools-mcp@1.1.1
              - --browserUrl=http://127.0.0.1:9222
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 600Mi
      postgres:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /var/lib/postgresql/data
                  subPath: data
              name: data
              size: 5Gi
        pod:
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/postgresql
              tag: 18.6@sha256:95521b6871a909e40cb53d8cab33b88f1bde7e7dd6309d64fccae1ae3c7c487e
            env:
              POSTGRES_DB: rekon
              POSTGRES_HOST_AUTH_METHOD: trust
            probes:
              liveness: &pg-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, postgres, -d, rekon]
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *pg-probe
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
    persistence:
      config:
        type: secret
        name: config
        advancedMounts:
          api:
            app:
              - path: /home/nonroot/config
          main:
            app:
              - path: /home/nonroot/config
              - path: /home/nonroot/.claude/CLAUDE.md
                subPath: CLAUDE.md
      screenshots:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /tmp/screenshots
            chrome-devtools-mcp:
              - path: /tmp/screenshots
            chromium:
              - path: /tmp/screenshots
      dshm:
        # The 64Mi default is too small for captureScreenshot: chromium backs
        # each CopyOutputResult bitmap with a file here and kills its GPU
        # process when the allocation fails.
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          main:
            chromium:
              - path: /dev/shm
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
    route:
      app:
        hostnames:
          - rekon.sko.ai
        labels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: rekon
        ports:
          http:
            port: 8080
          metrics:
            port: 9090
      postgres:
        controller: postgres
        ports:
          postgresql:
            port: 5432
