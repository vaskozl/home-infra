# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: rekon
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod: &api-pod
          hostUsers: false
          securityContext: &pod-security-context
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app: &api
            image: &appImage
              repository: registry.sko.ai/doudous/rekon/pkgupdate
              tag: 0.0.78@sha256:df86f4d9f17a5d2da03f022fa9311d73e43ab32ae03b5cc5e65c1ade19d17f1a
            args:
              - -db
              - postgres://postgres@rekon-postgres/rekon?sslmode=disable
              - -config
              - /home/nonroot/config
              - -v
              - -mode
              - api
            env: &env
              # Agent turns override this with a private per-turn dir.
              TMPDIR: /tmp
              DISABLE_TELEMETRY: "1"
              DISABLE_BUG_COMMAND: "1"
              DISABLE_AUTOUPDATER: "1"
              DISABLE_ERROR_REPORTING: "1"
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        forceRename: rekon
        replicas: 1
        type: statefulset
        serviceAccount:
          identifier: rekon
        pod:
          hostUsers: false
          # Lets the app container see and SIGKILL chromium to get a fresh
          # browser per agent turn.
          shareProcessNamespace: true
          securityContext: *pod-security-context
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            image: *appImage
            args:
              - -db
              - postgres://postgres@rekon-postgres/rekon?sslmode=disable
              - -config
              - /home/nonroot/config
              - -v
              - -mode
              - worker
            env:
              <<: *env
              PGSTORE_TEST_DSN: postgres://postgres@127.0.0.1:15432/postgres?sslmode=disable
            envFrom:
              - secretRef:
                  name: rekon-env
            resources:
              limits:
                cpu: 4
                memory: 14Gi
              requests:
                cpu: 400m
                memory: 3.2Gi
            securityContext: *security-context
          # Throwaway server for agent turns' tests and app runs. Not 5432: agents
          # may start other servers in the pod's single network namespace.
          testdb:
            image:
              repository: ghcr.io/vaskozl/postgresql
              tag: 18.6@sha256:a4284779780379c78a9e3d3a9c1e1f252891243f18eb30c2a3583a759e11677c
            env:
              PGPORT: "15432"
              POSTGRES_HOST_AUTH_METHOD: trust
            args:
              - -c
              - listen_addresses=127.0.0.1
              - -c
              - max_connections=500
              - -c
              - fsync=off
              - -c
              - synchronous_commit=off
              - -c
              - full_page_writes=off
              # An open transaction in any database holds back every database's
              # change feed; cap how long a forgotten session can do that.
              - -c
              - idle_in_transaction_session_timeout=60s
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              runAsUser: 70
              runAsGroup: 70
              runAsNonRoot: true
          chromium:
            image:
              repository: ghcr.io/vaskozl/chromium
              tag: 156.0.8078.47@sha256:935de7df061774c00d1d8f5b6dcb1b0258ef2cd86ac24d854ce7e63c8618fffb
            # Respawn loop: killing the browser must not exit the container,
            # or the kubelet applies restart backoff. The profile dir is wiped
            # first so a SIGKILL leaves no stale SingletonLock or state.
            command: ["sh", "-c"]
            args:
              - |
                while true; do
                  rm -rf /tmp/chrome
                  chromium-browser --headless --remote-debugging-port=9222 --user-data-dir=/tmp/chrome
                  sleep 1
                done
            resources:
              limits:
                # Includes the /dev/shm tmpfs, charged to this cgroup.
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 500Mi
          chrome-devtools-mcp:
            image:
              repository: ghcr.io/vaskozl/node
              tag: latest@sha256:2199603d3767437d01691bf8203a439ff1cdbe7245ba300e32bb65df1e6aaf5f
            command: ["npx"]
            args:
              - -y
              - mcp-proxy@6.5.1
              - --transport
              - streamablehttp
              # Not 8080: agents boot the app under test on it, and mcp-proxy
              # binds :: in the pod's single network namespace.
              - --port
              - "9223"
              - --
              - npx
              - -y
              - chrome-devtools-mcp@1.1.1
              - --browserUrl=http://127.0.0.1:9222
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 600Mi
      # Requeue every object once the new worker is up, so a release or config
      # change reaches objects nothing else wakes (docs/resync.md in rekon)
      resync:
        type: job
        annotations:
          helm.sh/hook: post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        pod: *api-pod
        containers:
          app:
            <<: *api
            args: [resync, -db, "postgres://postgres@rekon-postgres/rekon?sslmode=disable", -config, /home/nonroot/config]
      postgres:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              advancedMounts:
                app:
                  - path: /var/lib/postgresql
              name: data
              size: 5Gi
        pod:
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/postgresql
              tag: 18.6@sha256:a4284779780379c78a9e3d3a9c1e1f252891243f18eb30c2a3583a759e11677c
            env:
              POSTGRES_DB: rekon
              POSTGRES_HOST_AUTH_METHOD: trust
            args:
              - -c
              - shared_preload_libraries=pg_stat_statements
            probes:
              liveness: &pg-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, postgres, -d, rekon]
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *pg-probe
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
          exporter:
            image:
              repository: ghcr.io/prometheus-community/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            args:
              - --web.listen-address=:9187
              - --collector.stat_checkpointer
              - --collector.postmaster
              - --collector.stat_statements
              - --collector.stat_statements.include_query
              - --collector.stat_statements.limit=50
              - --collector.stat_statements.query_length=120
            env:
              DATA_SOURCE_NAME: postgresql://postgres@127.0.0.1:5432/rekon?sslmode=disable&options=-c%20default_transaction_read_only%3Don
            probes:
              liveness: &exporter-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9187
                  timeoutSeconds: 5
                  periodSeconds: 30
              readiness: *exporter-probe
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: regcred
    persistence:
      config:
        type: secret
        name: config
        advancedMounts:
          api:
            app:
              - path: /home/nonroot/config
          resync:
            app:
              - path: /home/nonroot/config
          main:
            app:
              - path: /home/nonroot/config
              - path: /home/nonroot/.claude/CLAUDE.md
                subPath: CLAUDE.md
      screenshots:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /tmp/screenshots
            chrome-devtools-mcp:
              - path: /tmp/screenshots
            chromium:
              - path: /tmp/screenshots
      dshm:
        # The 64Mi default is too small for captureScreenshot: chromium backs
        # each CopyOutputResult bitmap with a file here and kills its GPU
        # process when the allocation fails.
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          main:
            chromium:
              - path: /dev/shm
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
    route:
      app:
        hostnames:
          - rekon.sko.ai
        labels:
          agentgateway.sko.ai/auth: oauth2
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: rekon
        ports:
          http:
            port: 8080
          metrics:
            port: 9090
      postgres:
        controller: postgres
        labels:
          monitoring.sko.ai/exporter: postgres
        ports:
          postgresql:
            port: 5432
          postgres-metrics:
            port: 9187
