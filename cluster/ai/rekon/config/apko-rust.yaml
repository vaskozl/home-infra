apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: rust
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/rust
    - docker.io/vszl/rust
  versionFrom: rust
  config: |
    contents:
      packages:
        - rust
        - build-base
    entrypoint:
      command: /usr/bin/cargo
    cmd: help
    accounts:
      run-as: "0"
