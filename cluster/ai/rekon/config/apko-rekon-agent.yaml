apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: rekon-agent
  includes: [claude]
  tags: [latest]
  registries:
    - registry.sko.ai/doudous/rekon/agent
  versionFrom: rekon-pkgupdate
  config: |
    contents:
      packages:
        - rekon-pkgupdate
        - bun
        - gnupg
        - kubeconform
        - kustomize
        - postgresql-client
        - redis
        - redis-cli
        - sops
        - openvino
        - openvino-dev
        - openvino-tokenizers
        - baselabs-joey-1-int8
        - rekon
        - codex
        - helm
        - poppler-utils
        - onnxruntime
        - ppocrv6-tiny-models
        - chromium
        - xvfb-run
        - xkbcomp
        - xkeyboard-config
        - victoriametrics-vmalert
        - yam
    entrypoint:
      command: rekon-pkgupdate
    vcs-url: https://gitlab.sko.ai/doudous/rekon
    archs:
      - amd64
