apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: rekon-veroso
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - registry.sko.ai/doudous/rekon/veroso
  versionFrom: rekon-veroso
  config: |
    contents:
      packages:
        - rekon-veroso
        - rekon
        - codex
        - poppler-utils
        - onnxruntime
        - ppocrv6-tiny-models
        - chromium
        - xvfb-run
        - xkbcomp
        - xkeyboard-config
    entrypoint:
      command: rekon-veroso
    vcs-url: https://gitlab.sko.ai/doudous/rekon
