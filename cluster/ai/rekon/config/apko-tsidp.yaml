apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: tsidp
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/tsidp
    - docker.io/vszl/tsidp
  versionFrom: tsidp
  config: |
    contents:
      packages:
        - tsidp
    entrypoint:
      command: tsidp-server
    cmd: -dir=/var/lib/tsidp
    work-dir: /var/lib/tsidp
    vcs-url: https://github.com/tailscale/tsidp
