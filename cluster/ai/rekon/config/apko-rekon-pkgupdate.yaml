apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: rekon-pkgupdate
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - registry.sko.ai/doudous/rekon/pkgupdate
  versionFrom: rekon-pkgupdate
  config: |
    contents:
      packages:
        - rekon-pkgupdate
        - rekon
        - git
    entrypoint:
      command: rekon-pkgupdate
    vcs-url: https://gitlab.sko.ai/doudous/rekon
