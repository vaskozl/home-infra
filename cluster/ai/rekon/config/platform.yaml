# yaml-language-server: $schema=https://gitlab.sko.ai/doudous/rekon/-/raw/main/apps/pkgupdate/types/objects.schema.json
# pkgupdate's Platform: the deployment-wide settings it used to read from the
# environment. Secrets stay in rekon-env; the *TokenEnv fields name them.
apiVersion: v1alpha1
kind: platforms
spec:
  operators:
    - pi:096e2ba1-0272-4fae-be5e-9f3d76c66a0d
  publicURL: https://rekon.sko.ai
  gitlabHost: gitlab.sko.ai
  gitlabTokenEnv: GITLAB_TOKEN
  gitlabRetryTokenEnv: GITLAB_RETRY_TOKEN
  githubTokenEnv: GITHUB_TOKEN
  agentPodTemplate: ai/rekon-agent-turn
  alertAllowedHosts: []
