apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: busybox
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/busybox
  versionFrom: busybox-full
  config: |
    contents:
      packages:
        - busybox-full
    entrypoint:
      command: /bin/sh
