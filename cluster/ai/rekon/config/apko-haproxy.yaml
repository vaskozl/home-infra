apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: haproxy
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/haproxy
  versionFrom: haproxy
  config: |
    contents:
      packages:
        - haproxy
        - haproxy-oci-entrypoint
    accounts:
      run-as: "65532"
      groups:
        - groupname: haproxy
          gid: 65532
      users:
        - username: haproxy
          uid: 65532
          gid: 65532
          homedir: /home/haproxy
    entrypoint:
      command: /usr/local/bin/docker-entrypoint.sh
    cmd: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    work-dir: /var/lib/haproxy
    paths:
      - path: /var/lib/haproxy
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o755
    vcs-url: https://github.com/haproxy/haproxy
