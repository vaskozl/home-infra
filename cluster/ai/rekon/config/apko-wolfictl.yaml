apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: wolfictl
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/wolfictl
    - docker.io/vszl/wolfictl
  versionFrom: wolfictl
  config: |
    contents:
      packages:
        - wolfictl
        - ca-certificates-bundle
        - wolfi-baselayout
        - coreutils
        - bash
        - busybox
        - gitsign
        - make
        - graphviz
    entrypoint:
      command: /usr/bin/wolfictl
    cmd: --help
    work-dir: /work
    paths:
      - path: /work
        type: directory
        permissions: 511
    accounts:
      run-as: '0'
