apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: firefox
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/firefox
    - docker.io/vszl/firefox
  versionFrom: firefox
  config: |
    contents:
      packages:
        - firefox
    entrypoint:
      command: firefox
    cmd: --headless
