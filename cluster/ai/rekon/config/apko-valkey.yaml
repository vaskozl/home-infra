apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: valkey
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/valkey
    - docker.io/vszl/valkey
  versionFrom: valkey
  config: |
    contents:
      packages:
        - valkey
        - valkey-cli
    entrypoint:
      command: valkey-server
    cmd: --save "" --appendonly "no" --protected-mode "no"
    vcs-url: https://github.com/valkey-io/valkey
    work-dir: /data
    accounts:
      run-as: "65532"
      users:
        - username: valkey
          uid: 65532
          gid: 65532
          homedir: /home/valkey
      groups:
        - groupname: valkey
          gid: 65532
    paths:
      - path: /data
        type: directory
        uid: 65532
        gid: 65532
        permissions: 493
