apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: redis
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/redis
  versionFrom: redis
  config: |
    contents:
      packages:
        - redis
        - redis-cli
    accounts:
      run-as: "65532"
      groups:
        - groupname: redis
          gid: 65532
      users:
        - username: redis
          uid: 65532
          gid: 65532
          homedir: /home/redis
    entrypoint:
      command: /usr/bin/redis-server
    cmd: --save "" --appendonly "no" --protected-mode "no"
    work-dir: /data
    paths:
      - path: /data
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o755
    vcs-url: https://github.com/redis/redis
