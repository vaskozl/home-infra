apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: ignis
  includes: [wolfi-base]
  tags: [latest]
  # Bundles proprietary Obsidian assets: private registry only.
  registries:
    - registry.sko.ai/doudous/rekon/ignis
  versionFrom: ignis
  config: |
    contents:
      packages:
        - ignis
    entrypoint:
      command: ignis
    vcs-url: https://github.com/Nystik-gh/ignis
