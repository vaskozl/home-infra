apiVersion: v1alpha1
kind: updatepolicies
spec:
  org: Doudous
  name: fleet defaults
  orgs: [Doudous]
  update: 'true'
  automerge: "candidate.type in ['minor', 'patch', 'digest']"
  rebase: 'true'
  labels: [renovate, pkgupdate]
  model: opus
---
apiVersion: v1alpha1
kind: updatepolicies
spec:
  org: Doudous
  name: chromium upgrades
  images: [ghcr.io/vaskozl/chromium]
  update: 'true'
  automerge: "candidate.type in ['major', 'minor', 'patch', 'digest']"
  rebase: 'true'
  labels: [renovate, pkgupdate]
  model: opus
---
apiVersion: v1alpha1
kind: updatepolicies
spec:
  org: Doudous
  name: package defaults
  repos: [https://gitlab.sko.ai/doudous/packages.git]
  update: 'true'
  automerge: 'true'
  rebase: 'true'
  labels: [renovate, pkgupdate]
  model: opus
