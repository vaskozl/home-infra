apiVersion: v1alpha1
kind: updatepolicies
metadata:
  workspace: doudous
spec:
  name: fleet defaults
  repos:
    - https://gitlab.sko.ai/doudous/packages.git
    - https://gitlab.sko.ai/doudous/home-infra.git
    - https://gitlab.sko.ai/doudous/flux-infra.git
    - https://gitlab.sko.ai/doudous/rekon.git
  # Flux images bump with gotk-components; Renovate handles agentgateway
  # updates because it filters the legacy kgateway-era v2.x chart tags.
  update: "!candidate.name.startsWith('ghcr.io/fluxcd/') && !candidate.name.startsWith('ghcr.io/agentgateway/')"
  automerge: "!candidate.name.startsWith('ghcr.io/agentgateway/') && candidate.type in ['minor', 'patch', 'digest']"
  rebase: 'true'
  labels: [renovate, pkgupdate]
  model: opus
---
apiVersion: v1alpha1
kind: updatepolicies
metadata:
  workspace: doudous
spec:
  name: chromium upgrades
  priority: 10
  repos: [https://gitlab.sko.ai/doudous/home-infra.git]
  automerge: "!candidate.name.startsWith('ghcr.io/agentgateway/') && (candidate.name == 'ghcr.io/vaskozl/chromium' || candidate.type in ['minor', 'patch', 'digest'])"
---
apiVersion: v1alpha1
kind: updatepolicies
metadata:
  workspace: doudous
spec:
  name: package defaults
  priority: 10
  repos: [https://gitlab.sko.ai/doudous/packages.git]
  update: 'true'
  automerge: 'true'
  rebase: 'true'
  labels: [renovate, pkgupdate]
  model: opus
