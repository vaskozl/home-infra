apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: blocky
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/blocky
    - docker.io/vszl/blocky
  versionFrom: blocky
  config: |
    contents:
      packages:
        - blocky
    entrypoint:
      command: blocky
    vcs-url: https://github.com/0xERR0R/blocky
