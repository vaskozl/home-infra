apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: rekon-ci-decide
  includes: [rekon-ci]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/rekon-ci-decide
  versionFrom: go
  config: |
    contents:
      packages:
        - openvino
        - openvino-tokenizers
        - baselabs-joey-1-int8
    archs:
      - amd64
