apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: brew
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/brew
  versionFrom: brew
  config: |
    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/linuxbrew/.linuxbrew/bin"
    contents:
      packages:
        - brew
        - apk-tools
        - apko
        - bash
        - bind-tools
        - busybox-full
        - conntrack-tools
        - curl
        - ethtool
        - fzf
        - gettext
        - gh
        - git
        - glab
        - go
        - gofumpt
        - golangci-lint
        - htop
        - iftop
        - iproute2
        - jq
        - just
        - kubectl
        - kubectl-default
        - melange
        - perl
        - perl-common-sense
        - perl-email-date-format
        - perl-io-socket-ssl
        - perl-json-xs
        - perl-mime-lite
        - perl-mime-types
        - perl-mojolicious
        - perl-path-tiny
        - perl-timedate
        - perl-types-serialiser
        - perl-yaml-pp
        - ripgrep
        - rustup
        - socat
        - tmux
        - util-linux-misc
        - wget
        - yq
        - zlib-dev
    entrypoint:
      command: /bin/bash
    work-dir: /home/nonroot
    paths:
      - path: /home/linuxbrew/.linuxbrew
        type: directory
        uid: 568
        gid: 568
        permissions: 0o755
        recursive: true
