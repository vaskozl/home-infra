apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: mariadb
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/mariadb
  versionFrom: mariadb
  config: |
    contents:
      packages:
        - mariadb
        - mariadb-client
        - mariadb-oci-entrypoint
    accounts:
      run-as: "65532"
      groups:
        - groupname: mysql
          gid: 65532
      users:
        - username: mysql
          uid: 65532
          gid: 65532
          homedir: /home/mysql
    entrypoint:
      command: /usr/local/bin/docker-entrypoint.sh mariadbd
    paths:
      - path: /var/lib/mysql
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o777
      - path: /var/tmp
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o777
      - path: /run/mysqld
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o777
      - path: /docker-entrypoint-initdb.d
        type: directory
        uid: 65532
        gid: 65532
        permissions: 0o777
    vcs-url: https://github.com/MariaDB/server
