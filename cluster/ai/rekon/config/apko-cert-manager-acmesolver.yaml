apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: cert-manager-acmesolver
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/cert-manager-acmesolver
  versionFrom: cert-manager-acmesolver
  config: |
    contents:
      packages:
        - cert-manager-acmesolver
    accounts:
      groups:
        - groupname: nonroot
          gid: 65532
      users:
        - username: nonroot
          uid: 65532
          gid: 65532
      run-as: nonroot
    entrypoint:
      command: /usr/bin/acmesolver
    vcs-url: https://github.com/cert-manager/cert-manager
