apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: sing-box
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/sing-box
    - docker.io/vszl/sing-box
  versionFrom: sing-box
  config: |
    contents:
      packages:
        - sing-box
    entrypoint:
      command: sign-box
    vcs-url: https://github.com/sagernet/sing-box
