apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: tailscale-operator
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/tailscale-operator
    - docker.io/vszl/tailscale-operator
  versionFrom: tailscale-operator
  config: |
    contents:
      packages:
        - tailscale-operator
    entrypoint:
      command: operator
    vcs-url: https://github.com/tailscale/tailscale
