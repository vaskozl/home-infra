apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: code-server
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/code-server
  versionFrom: code-server
  config: |
    environment:
      ENTRYPOINTD: /entrypoint.d
      LANG: en_US.UTF-8
      USER: coder
    contents:
      packages:
        - code-server
        - code-server-compat
        - zsh
        - apk-tools
        - docker
    accounts:
      run-as: coder
      groups:
        - groupname: coder
          gid: 1000
      users:
        - username: coder
          uid: 1000
          shell: /bin/zsh
    entrypoint:
      command: /usr/bin/entrypoint.sh
    cmd: --bind-addr 0.0.0.0:8080 .
    work-dir: /home/coder
    vcs-url: https://github.com/coder/code-server
