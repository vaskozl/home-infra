apiVersion: v1alpha1
kind: apkoimages
metadata:
  workspace: doudous
spec:
  name: chromium
  includes: [wolfi-base]
  tags: [latest]
  registries:
    - ghcr.io/vaskozl/chromium
  versionFrom: chromium
  config: |
    contents:
      packages:
        - chromium
    entrypoint:
      command: chromium-browser
    cmd: --headless --no-sandbox --disable-gpu
