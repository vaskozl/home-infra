# IndexNow key for submitting veroso.com URLs to Bing. The app answers 401 to
# paths it does not know, so the gateway serves it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: indexnow
spec:
  parentRefs:
    - name: public
      namespace: agentgateway
  hostnames:
    - veroso.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /dcf92f565d764c41307c2a51bf28aa78.txt
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: indexnow
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: indexnow
  traffic:
    directResponse:
      status: 200
      headers:
        - name: content-type
          value: '"text/plain; charset=utf-8"'
      body: dcf92f565d764c41307c2a51bf28aa78
