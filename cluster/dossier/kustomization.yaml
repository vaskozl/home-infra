# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dossier
resources:
  - _namespace.yaml
  - indexnow.yaml
  - robots.yaml
  - hr.yaml
  - regcred.enc.yaml
  - oidc-secret.enc.yaml
  - vmservicescrape.yaml
  - netpol.yaml
components:
  - ../common
# Generated so the name hash changes with the values: that is what makes a
# rotation roll api/main/minio and recreate the TTL-collected minio-init Job,
# which resets the user's secret. To rotate: sops the file, merge. Change
# VEROSO_S3_SECRET_KEY only; a new VEROSO_S3_ACCESS_KEY adds a second user
# and leaves the old one valid.
secretGenerator:
  - name: minio
    envs:
      - minio.enc.env
  - name: minio-root
    envs:
      - minio-root.enc.env
configMapGenerator:
  - name: seed
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - markets.yaml=config/markets.yaml
      - providers.yaml=config/providers.yaml
      - platform.yaml=config/platform.yaml
  - name: ovms-export
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - openvino/export.py
configurations:
  - kustomizeconfig.yaml
