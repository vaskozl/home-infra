# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: dossier
  namespace: dossier
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod: &pod
          hostUsers: false
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            env: &env
              VEROSO_LIVE: "1"
              CONFIG_DIR: /config
              VEROSO_PUBLIC_URL: https://veroso.com
              VEROSO_OPERATOR_ORG: Doudous
              VEROSO_OPERATOR_FOUNDER: "pi:096e2ba1-0272-4fae-be5e-9f3d76c66a0d"
              VEROSO_OPERATOR_QUOTA: "50"
              # A bare host would be dialed as TLS
              VEROSO_S3_ENDPOINT: http://minio:9000
              VEROSO_S3_BUCKET: dossier
            envFrom: &envFrom
              - secretRef:
                  name: oidc
              - secretRef:
                  name: minio
            image: &image
              repository: registry.sko.ai/doudous/rekon/veroso
              tag: 0.0.67@sha256:367186b01ff689acbe63e6dd4f8f119b6f9209879d73a2ab7f3bd3bf0ca7731e
            args:
              - -redis
              - dossier-redis:6379
              - -vector-redis
              - dossier-vector-redis:6379
              - -v
              - -mode
              - api
              - -prune-stale
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        type: statefulset
        forceRename: dossier
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            env:
              <<: *env
              GOMAXPROCS: "2"
            envFrom: *envFrom
            image: *image
            args:
              - -redis
              - dossier-redis:6379
              - -vector-redis
              - dossier-vector-redis:6379
              - -v
              - -mode
              - worker
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext: *security-context
      minio:
        type: statefulset
        replicas: 1
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /data
              name: data
              size: 20Gi
        containers:
          app:
            args:
              - server
              - /data
            env:
              MINIO_BROWSER: "off"
            envFrom:
              - secretRef:
                  name: minio-root
            image: &minio-image
              repository: ghcr.io/vaskozl/minio
              tag: 0.20260922@sha256:7b48cb89e1ef7023dea45248d46531f5a1ac6bd31ab5f2df606602482bbb5eeb
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/ready
                    port: 9000
                  periodSeconds: 10
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext: &minio-security-context
              runAsGroup: 568
              runAsUser: 568
      minio-init:
        type: job
        pod: *pod
        job:
          backoffLimit: 20
          # Let the Job be collected so a later upgrade recreates it instead of
          # failing on the immutable pod template
          ttlSecondsAfterFinished: 600
        containers:
          app:
            command:
              - sh
              - -c
              - |
                set -eu
                mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                mc mb --ignore-existing local/dossier
                # s3:ListBucket is not for listing: the app's boot-time
                # BucketExists probe is a HeadBucket, which minio authorizes as
                # s3:ListBucket. Without it the app fails to start.
                cat > /tmp/dossier-rw.json <<'JSON'
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                      "Resource": ["arn:aws:s3:::dossier"]
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject",
                        "s3:AbortMultipartUpload",
                        "s3:ListMultipartUploadParts"
                      ],
                      "Resource": ["arn:aws:s3:::dossier/*"]
                    }
                  ]
                }
                JSON
                mc admin policy create local dossier-rw /tmp/dossier-rw.json
                mc admin user add local "$VEROSO_S3_ACCESS_KEY" "$VEROSO_S3_SECRET_KEY"
                # attach is not idempotent: it errors once the policy is on the user
                mc admin user info local "$VEROSO_S3_ACCESS_KEY" | grep -q dossier-rw ||
                  mc admin policy attach local dossier-rw --user "$VEROSO_S3_ACCESS_KEY"
            env:
              MC_CONFIG_DIR: /tmp/mc
            envFrom:
              - secretRef:
                  name: minio-root
              - secretRef:
                  name: minio
            image: *minio-image
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext: *minio-security-context
      ovms:
        type: statefulset
        forceRename: ovms
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /models
              name: models
              size: 20Gi
        initContainers:
          export:
            image: &ovms-image
              repository: openvino/model_server
              tag: 2026.4.1@sha256:148e3fe802261ed0b5b634de3bbccdefe7176a218ec34a88e382b40704c34a1c
            command:
              - /opt/uv/uv
              - run
              - /opt/ovms-export/export.py
            args:
              - google/siglip2-so400m-patch16-256
            env:
              UV_CACHE_DIR: /models/.uv/cache
              UV_PYTHON_INSTALL_DIR: /models/.uv/python
              # Let the script's openvino load its own libs; ovms has a RUNPATH
              LD_LIBRARY_PATH: ""
              # Keep downloads on the volume so an interrupted export resumes
              HF_HOME: /models/.cache/huggingface
            resources: &ovms-resources
              limits:
                cpu: "4"
                memory: 2Gi
              requests:
                cpu: "0.5"
                memory: 1.4Gi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image: *ovms-image
            args:
              - --rest_port=8000
              - --port=9000
              - --config_path=/models/config.json
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ovms-ready
                    path: /v2/health/ready
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v2/health/live
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 8
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ovms-ready
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources: *ovms-resources
      redis:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
        containers:
          app:
            image: &redstream-image
              repository: ghcr.io/vaskozl/redstream
              tag: 0.0.4@sha256:a228723fc20cf1b0e069721e7bb0b152d6e01af843ba3791d7325bd02a1fa635
            args: ['run', '--replica=s3://veroso-redis/dossier-v2', '--', '--bind', '*', '-::*', '--protected-mode', 'no']
            envFrom:
              - secretRef:
                  name: r2-credentials
            probes: &redstream-probes
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8081
                  periodSeconds: 1
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 2Gi
      vector-redis:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
        containers:
          app:
            image: *redstream-image
            # Reset together with the main redis prefix: alerts record what
            # they embedded and never refill a vector set wiped on its own
            args: ['run', '--replica=s3://veroso-redis/dossier-vectors-v2', '--', '--bind', '*', '-::*', '--protected-mode', 'no']
            envFrom:
              - secretRef:
                  name: r2-credentials
            probes: *redstream-probes
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 384Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
      uv:
        type: image
        image:
          repository: ghcr.io/astral-sh/uv
          tag: 0.12.24@sha256:3af4716e991d6956a41e573eab705d0ee08500cd829ed30293eb8472f372c65a
        advancedMounts:
          ovms:
            export:
              - path: /opt/uv
      ovms-export:
        type: configMap
        name: ovms-export
        advancedMounts:
          ovms:
            export:
              - path: /opt/ovms-export
                readOnly: true
      seed:
        type: configMap
        name: seed
        advancedMounts:
          api:
            app:
              - path: /config
          main:
            app:
              - path: /config
    route:
      app:
        hostnames:
          - veroso.com
        parentRefs:
          - name: public
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: dossier
        ports:
          http:
            port: 8080
      minio:
        controller: minio
        forceRename: minio
        ports:
          s3:
            port: 9000
      ovms:
        controller: ovms
        forceRename: ovms
        ports:
          http:
            port: 8000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
      vector-redis:
        controller: vector-redis
        ports:
          redis:
            port: 6379
