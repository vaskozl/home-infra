# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: dossier
  namespace: dossier
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod: &pod
          hostUsers: false
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app: &api
            envFrom: &envFrom
              - secretRef:
                  name: oidc
              - secretRef:
                  name: minio
            image: &image
              repository: registry.sko.ai/doudous/rekon/veroso
              tag: 0.0.78@sha256:0fc07edfe4b83c1d6b599c5aa3f461cb68cb430fcb57395ad62aa3b9dd0ce827
            args:
              - -db
              - postgres://postgres@dossier-postgres/veroso?sslmode=disable
              - -config
              - /config
              - -v
              - -mode
              - api
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        type: statefulset
        forceRename: dossier
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            env:
              GOMAXPROCS: "2"
            envFrom: *envFrom
            image: *image
            args:
              - -db
              - postgres://postgres@dossier-postgres/veroso?sslmode=disable
              - -config
              - /config
              - -v
              - -mode
              - worker
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext: *security-context
      # Requeue every object once the new worker is up, so a release or seed
      # change reaches objects nothing else wakes (docs/resync.md in rekon)
      resync:
        type: job
        annotations:
          helm.sh/hook: post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        pod: *pod
        containers:
          app:
            <<: *api
            args: [resync, -db, "postgres://postgres@dossier-postgres/veroso?sslmode=disable", -config, /config]
      minio:
        type: statefulset
        replicas: 1
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /data
              name: data
              size: 20Gi
        containers:
          app:
            args:
              - server
              - /data
            env:
              MINIO_BROWSER: "off"
            envFrom:
              - secretRef:
                  name: minio-root
            image: &minio-image
              repository: ghcr.io/vaskozl/minio
              tag: 0.20260922@sha256:062a850e7c3c397574fa2681c5721092f6240c94464bc452023c492adeff7161
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/ready
                    port: 9000
                  periodSeconds: 10
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext: &minio-security-context
              runAsGroup: 568
              runAsUser: 568
      minio-init:
        type: job
        pod: *pod
        job:
          backoffLimit: 20
          # Let the Job be collected so a later upgrade recreates it instead of
          # failing on the immutable pod template
          ttlSecondsAfterFinished: 600
        containers:
          app:
            command:
              - sh
              - -c
              - |
                set -eu
                mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                mc mb --ignore-existing local/dossier
                # s3:ListBucket is not for listing: the app's boot-time
                # BucketExists probe is a HeadBucket, which minio authorizes as
                # s3:ListBucket. Without it the app fails to start.
                cat > /tmp/dossier-rw.json <<'JSON'
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                      "Resource": ["arn:aws:s3:::dossier"]
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject",
                        "s3:AbortMultipartUpload",
                        "s3:ListMultipartUploadParts"
                      ],
                      "Resource": ["arn:aws:s3:::dossier/*"]
                    }
                  ]
                }
                JSON
                mc admin policy create local dossier-rw /tmp/dossier-rw.json
                mc admin user add local "$VEROSO_S3_ACCESS_KEY" "$VEROSO_S3_SECRET_KEY"
                # attach is not idempotent: it errors once the policy is on the user
                mc admin user info local "$VEROSO_S3_ACCESS_KEY" | grep -q dossier-rw ||
                  mc admin policy attach local dossier-rw --user "$VEROSO_S3_ACCESS_KEY"
            env:
              MC_CONFIG_DIR: /tmp/mc
            envFrom:
              - secretRef:
                  name: minio-root
              - secretRef:
                  name: minio
            image: *minio-image
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext: *minio-security-context
      ovms:
        type: statefulset
        forceRename: ovms
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /models
              name: models
              size: 20Gi
        initContainers:
          export:
            image: &ovms-image
              repository: openvino/model_server
              tag: 2026.4.1@sha256:148e3fe802261ed0b5b634de3bbccdefe7176a218ec34a88e382b40704c34a1c
            command:
              - /opt/uv/uv
              - run
              - /opt/ovms-export/export.py
            args:
              - google/siglip2-so400m-patch16-256
            env:
              UV_CACHE_DIR: /models/.uv/cache
              UV_PYTHON_INSTALL_DIR: /models/.uv/python
              # Let the script's openvino load its own libs; ovms has a RUNPATH
              LD_LIBRARY_PATH: ""
              # Keep downloads on the volume so an interrupted export resumes
              HF_HOME: /models/.cache/huggingface
            resources: &ovms-resources
              limits:
                cpu: "4"
                memory: 2Gi
              requests:
                cpu: "0.5"
                memory: 1.4Gi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image: *ovms-image
            args:
              - --rest_port=8000
              - --port=9000
              - --config_path=/models/config.json
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ovms-ready
                    path: /v2/health/ready
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v2/health/live
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 8
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ovms-ready
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources: *ovms-resources
      postgres:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              advancedMounts:
                app:
                  - path: /var/lib/postgresql
              name: data
              size: 20Gi
        pod:
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/postgresql
              tag: 18.6@sha256:ba47de5492e45c6b43e910cc723f21ed876c002d316df8193d4331c884f73132
            env:
              POSTGRES_DB: veroso
              POSTGRES_HOST_AUTH_METHOD: trust
            args:
              - -c
              - shared_preload_libraries=pg_stat_statements
            probes:
              liveness: &pg-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, postgres, -d, veroso]
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *pg-probe
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 512Mi
          exporter:
            image:
              repository: ghcr.io/prometheus-community/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            args:
              - --web.listen-address=:9187
              - --collector.stat_checkpointer
              - --collector.postmaster
              - --collector.stat_statements
              - --collector.stat_statements.include_query
              - --collector.stat_statements.limit=50
              - --collector.stat_statements.query_length=120
            env:
              DATA_SOURCE_NAME: postgresql://postgres@127.0.0.1:5432/veroso?sslmode=disable&options=-c%20default_transaction_read_only%3Don
            probes:
              liveness: &exporter-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9187
                  timeoutSeconds: 5
                  periodSeconds: 30
              readiness: *exporter-probe
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
      vector-redis:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
        containers:
          app:
            image:
              repository: ghcr.io/vaskozl/redis
              tag: 8.10.2@sha256:86e46661643fea688933f7ceb7f52c6923976255cb2ca5bd576beb549ba58a98
            # Ephemeral: veroso's VectorSync refills the vector set from postgres
            args: ['--save', '', '--appendonly', 'no']
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 384Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      uv:
        type: image
        image:
          repository: ghcr.io/astral-sh/uv
          tag: 0.13.5@sha256:32a7bb39b496babbd997b0a39a4d66c126bdaf5661b302bf6f06abda8deca6ff
        advancedMounts:
          ovms:
            export:
              - path: /opt/uv
      ovms-export:
        type: configMap
        name: ovms-export
        advancedMounts:
          ovms:
            export:
              - path: /opt/ovms-export
                readOnly: true
      seed:
        type: configMap
        name: seed
        advancedMounts:
          api:
            app:
              - path: /config
          main:
            app:
              - path: /config
          resync:
            app:
              - path: /config
    route:
      app:
        hostnames:
          - veroso.com
        parentRefs:
          - name: public
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: dossier
        ports:
          http:
            port: 8080
          metrics:
            port: 9090
      minio:
        controller: minio
        forceRename: minio
        ports:
          s3:
            port: 9000
      ovms:
        controller: ovms
        forceRename: ovms
        ports:
          http:
            port: 8000
      postgres:
        controller: postgres
        labels:
          monitoring.sko.ai/exporter: postgres
        ports:
          postgresql:
            port: 5432
          postgres-metrics:
            port: 9187
      vector-redis:
        controller: vector-redis
        ports:
          redis:
            port: 6379
