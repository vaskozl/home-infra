# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: dossier
  namespace: dossier
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.0.1
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        pod: &pod
          hostUsers: false
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            env: &env
              SAFETY_GATE_LIVE: "1"
              EURLEX_LIVE: "1"
              DG_GROW_LIVE: "1"
              CONFIG_DIR: /config
              DOSSIER_PUBLIC_URL: https://dossier.sko.ai
            envFrom: &envFrom
              - secretRef:
                  name: oidc
            image: &image
              repository: registry.sko.ai/doudous/rekon/dossier
              tag: 0.0.42
            args:
              - -redis
              - redis-master:6379
              - -v
              - -mode
              - api
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 700m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        type: statefulset
        forceRename: dossier
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            env:
              <<: *env
              GOMAXPROCS: "2"
            envFrom: *envFrom
            image: *image
            args:
              - -redis
              - redis-master:6379
              - -v
              - -mode
              - worker
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 2
                memory: 512Mi
            securityContext: *security-context
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      api-home:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          api:
            app:
              - path: /home/nonroot
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
      seed:
        type: configMap
        name: seed
        advancedMounts:
          main:
            app:
              - path: /config
    route:
      app:
        hostnames:
          - dossier.sko.ai
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        ports:
          http:
            port: 8080
