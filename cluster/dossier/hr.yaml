# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    patch.sko.ai/app-template: common
  name: dossier
  namespace: dossier
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.0.1
  interval: 24h
  values:
    controllers:
      api:
        type: deployment
        replicas: 1
        pod: &pod
          hostUsers: false
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            env: &env
              SAFETY_GATE_LIVE: "1"
              EURLEX_LIVE: "1"
              DG_GROW_LIVE: "1"
              CONFIG_DIR: /config
              DOSSIER_PUBLIC_URL: https://dossier.sko.ai
              # A bare host would be dialed as TLS
              DOSSIER_S3_ENDPOINT: http://minio:9000
              DOSSIER_S3_BUCKET: dossier
            envFrom: &envFrom
              - secretRef:
                  name: oidc
              - secretRef:
                  name: minio
            image: &image
              repository: registry.sko.ai/doudous/rekon/dossier
              tag: 0.0.47
            args:
              - -redis
              - redis-master:6379
              - -v
              - -mode
              - api
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 700m
                memory: 128Mi
            securityContext: &security-context
              allowPrivilegeEscalation: true
              procMount: Unmasked
              runAsGroup: 568
              runAsUser: 568
              seccompProfile:
                type: Unconfined
      main:
        type: statefulset
        forceRename: dossier
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /home/nonroot
              name: home
              size: 20Gi
        containers:
          app:
            env:
              <<: *env
              GOMAXPROCS: "2"
            envFrom: *envFrom
            image: *image
            args:
              - -redis
              - redis-master:6379
              - -v
              - -mode
              - worker
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 2
                memory: 512Mi
            securityContext: *security-context
      minio:
        type: statefulset
        replicas: 1
        pod: *pod
        statefulset:
          volumeClaimTemplates:
            - accessMode: ReadWriteOnce
              globalMounts:
                - path: /data
              name: data
              size: 20Gi
        containers:
          app:
            args:
              - server
              - /data
            env:
              MINIO_BROWSER: "off"
            envFrom:
              - secretRef:
                  name: minio-root
            image: &minio-image
              repository: ghcr.io/vaskozl/minio
              tag: 0.20260717@sha256:5a62cb7c4a2848507143fafdf71a176b020419c352ce450f753f0285d2cb462c
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/ready
                    port: 9000
                  periodSeconds: 10
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext: &minio-security-context
              runAsGroup: 568
              runAsUser: 568
      minio-init:
        type: job
        pod: *pod
        job:
          backoffLimit: 20
          # Let the Job be collected so a later upgrade recreates it instead of
          # failing on the immutable pod template
          ttlSecondsAfterFinished: 600
        containers:
          app:
            command:
              - sh
              - -c
              - |
                set -eu
                mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                mc mb --ignore-existing local/dossier
                cat > /tmp/dossier-rw.json <<'JSON'
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": ["s3:GetBucketLocation"],
                      "Resource": ["arn:aws:s3:::dossier"]
                    },
                    {
                      "Effect": "Allow",
                      "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject",
                        "s3:AbortMultipartUpload",
                        "s3:ListMultipartUploadParts"
                      ],
                      "Resource": ["arn:aws:s3:::dossier/*"]
                    }
                  ]
                }
                JSON
                mc admin policy create local dossier-rw /tmp/dossier-rw.json
                mc admin user add local "$DOSSIER_S3_ACCESS_KEY" "$DOSSIER_S3_SECRET_KEY"
                # attach is not idempotent: it errors once the policy is on the user
                mc admin user info local "$DOSSIER_S3_ACCESS_KEY" | grep -q dossier-rw ||
                  mc admin policy attach local dossier-rw --user "$DOSSIER_S3_ACCESS_KEY"
            env:
              MC_CONFIG_DIR: /tmp/mc
            envFrom:
              - secretRef:
                  name: minio-root
              - secretRef:
                  name: minio
            image: *minio-image
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext: *minio-security-context
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
    persistence:
      turn-fifo:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            app:
              - path: /run/claude
      seed:
        type: configMap
        name: seed
        advancedMounts:
          api:
            app:
              - path: /config
          main:
            app:
              - path: /config
    route:
      app:
        hostnames:
          - dossier.sko.ai
        parentRefs:
          - name: internal
            namespace: agentgateway
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: api
        forceRename: dossier
        ports:
          http:
            port: 8080
      minio:
        controller: minio
        forceRename: minio
        ports:
          s3:
            port: 9000
