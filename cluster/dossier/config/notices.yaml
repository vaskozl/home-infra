# The guidelines on Article 4 of the Market Surveillance Regulation (EU)
# 2019/1020, which veroso does not hold. Read with the GPSR, whose Article 16(1)
# applies Article 4(2) and (3) to every product it covers, and with the acts
# Article 4(5) lists and their successors. Sent: scope, the economic operator's
# tasks, the practical implications for operators and the text of Article 4.
# Left out: the introduction and the authorities' side (Section 5).
apiVersion: v1alpha1
kind: notices
spec:
  market: EU
  celex: "52021XC0323(01)" # 2021/C 100/01, the MSR Article 4 guidelines
  laws:
    - "32023R0988" # GPSR, by its Article 16(1)
    - "32011R0305" # Construction Products Regulation
    - "32016R0425" # PPE Regulation
    - "32016R0426" # Gas Appliances Regulation
    - "32000L0014" # Outdoor Noise Directive
    - "32006L0042" # Machinery Directive
    - "32009L0048" # Toy Safety Directive
    - "32009L0125" # Ecodesign Directive
    - "32011L0065" # RoHS Directive
    - "32013L0029" # Pyrotechnic Articles Directive
    - "32013L0053" # Recreational Craft Directive
    - "32014L0029" # Simple Pressure Vessels Directive
    - "32014L0030" # EMC Directive
    - "32014L0031" # Non-Automatic Weighing Instruments Directive
    - "32014L0032" # Measuring Instruments Directive
    - "32014L0034" # ATEX Directive
    - "32014L0035" # Low Voltage Directive
    - "32014L0053" # Radio Equipment Directive
    - "32014L0068" # Pressure Equipment Directive
    - "32023R1230" # Machinery Regulation, the Machinery Directive's successor
    - "32025R2509" # Toy Safety Regulation, the Toy Safety Directive's successor
    - "32024R1781" # ESPR, the Ecodesign Directive's successor
    - "32024R3110" # Construction Products Regulation 2024, its predecessor's successor
  sections:
    - Section 2
    - Section 3
    - Section 4
    - Section 6
