# The Appendix D claim screen. Each row is a regex over listing copy, the class
# of claim it detects, the regime that decides what a register's silence means
# for a match, and the act and provision a match cites. The citation is a field
# rather than a constant precisely so a food vertical seeds its own rows against
# Regulation (EC) No 1924/2006 without a new detector.
#
# Priorities separate the specific patterns from the catch-all: "paraben-free" is
# a free-from claim, but a phrase that some future row reads more precisely should
# win the span outright rather than tie.
#
# spec.categories carries the CategoryMapping's readable identity value (its
# sourceLabel); config.DeriveRefs() rewrites it to the derived id at load. The
# mappings themselves are created later by the Go requirement seed, which is fine
# because a derived id is deterministic. Attachment at the category rung rather
# than the market rung is what keeps a "BPA-free" USB charger from collecting a
# finding that cites cosmetics law.
#
# ClaimPolicy declares identity: [slug], so metadata.id derives from spec.slug.
apiVersion: v1alpha1
kind: claimpolicies
spec:
  slug: clinically-proven
  name: Clinically proven
  pattern: 'clinically\s+proven'
  claimType: health
  regime: cosmetic
  substantiation: clinical-evidence
  regulationCelex: '32009R1223'
  provisionRef: Article 20
  priority: 10
  categories:
    - Cosmetics
