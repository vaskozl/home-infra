---
# A rule for a wording that IS authorised. It looks redundant and is not: the
# screen's job is to find claims, the register's job is to grade them, and a
# screen that only looked for suspicious phrasing could never report a claim as
# permitted. This is what makes `permitted` an observed result rather than the
# absence of a detector.
apiVersion: v1alpha1
kind: claimpolicies
spec:
  slug: food-vitamin-c-immune
  name: Vitamin C and the immune system
  pattern: '\bvitamin\s+c\s+contributes\s+to\s+the\s+normal\s+function\s+of\s+the\s+immune\s+system\b'
  claimType: health
  regime: food-health
  substantiation: authorised-claim
  regulationCelex: '32006R1924'
  provisionRef: Article 10
  priority: 10
  categories:
    - Food supplements
