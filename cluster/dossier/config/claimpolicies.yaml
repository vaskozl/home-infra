---
# The food vertical. These are a DIFFERENT REGIME, not more rows of the same
# screen: a health claim on a food is governed by Regulation (EC) No 1924/2006,
# which publishes an allowlist, so absence from that list is the breach. The rows
# above are cosmetics claims under 1223/2009 Article 20, where there is no list
# and absence from one proves nothing. Mixing the two would let a "dermatologist
# recommended" cream be reported as making a prohibited health claim, which is a
# confident accusation under a law that does not apply to it.
#
# They still name a substantiation. It is the fallback rung for the case where the
# register has not been mirrored for the product's market: with nothing to check
# against, a health claim asks for a look rather than passing as permitted.
apiVersion: v1alpha1
kind: claimpolicies
spec:
  slug: food-immune-boost
  name: Boosts the immune system
  pattern: '\bboosts?\s+(?:your\s+)?immune\s+system\b'
  claimType: health
  regime: food-health
  substantiation: authorised-claim
  regulationCelex: '32006R1924'
  provisionRef: Article 10
  priority: 10
  categories:
    - Food supplements
---
apiVersion: v1alpha1
kind: claimpolicies
