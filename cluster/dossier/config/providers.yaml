# yaml-language-server: $schema=https://gitlab.sko.ai/doudous/rekon/-/raw/main/contrib/auth/types/objects.schema.json
apiVersion: v1alpha1
kind: authproviders
spec:
  name: google
  type: oidc
  displayName: Google
  icon: "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
  issuer: "https://accounts.google.com"
  clientId: "253514321271-gnf26856evk2anpldcn88opfkr08s8r6.apps.googleusercontent.com"
  clientSecretEnv: GOOGLE_CLIENT_SECRET
  scopes:
    - openid
    - profile
    - email
  emailVerifiedRequired: true
  enabled: true

