# yaml-language-server: $schema=https://gitlab.sko.ai/doudous/rekon/-/raw/main/examples/veroso/types/objects.schema.json
# The acts this deployment knows: a short list, not a mirror of EU law. An act
# naming `register: eurlex-cellar` is the EUR-Lex pull's work-list, which files
# its provisions; one naming no register is cited but never ingested, and the
# provisions it needs are stated in provisions.yaml.
#
# What an act binds (the Safety Gate categories, standard numbers and repealed
# acts the risk assessment's neighbour vote binds through) is not stated here:
# the Regulation mints it from the text it holds (law.ScopeMinter).
#
# Refs carry readable identity values (an actID, a register name);
# config.DeriveRefs() rewrites them to derived ids at load. Regulation
# declares identity: [actID].
apiVersion: v1alpha1
kind: regulations
spec:
  actID: "32009R1223"
  shortName: Cosmetics Regulation
  title: Regulation (EC) No 1223/2009 on cosmetic products
  market: EU
  sourceURL: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009R1223
  register: eurlex-cellar
---
apiVersion: v1alpha1
kind: regulations
