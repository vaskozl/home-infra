# yaml-language-server: $schema=https://gitlab.sko.ai/doudous/rekon/-/raw/main/examples/veroso/types/objects.schema.json
# The listing rules: every duty decided from what the online offer shows, one
# row each. A row quotes its provision, says how the offer is read against it
# (CEL over the listing, or a question a decision model answers), and what a
# finding asks for. Its hit is keyed rule:<slug>, which is the detector a
# Requirement names it by (internal/knowledge/requirementtable.go).
#
# These rows are a bootstrap, not the source: the act controller (#1893) mints
# ListingRule rows from the ingested law, and these become what its tests expect
# it to mint. Do not grow this file as the long-term home of a rule.
#
# A CEL rule reads `listing` (model.Listing: the offer's extracted fields, its
# text, its ingredient lines) and `authorised` (the live health claim wordings of
# the product's market, lower-cased with whitespace collapsed; null where none
# is mirrored). It returns a
# bool (true is a finding), or the strings it matched (non-empty is a finding,
# and the matches are the evidence), or null where it cannot decide: a claim
# rule over a listing with no copy has read nothing, so its duty stays unrated.
#
# Matches on the same provision count once: a span two rows match is reported
# by the longer match. There is no priority: a pattern that is too generic is
# fixed in its row.
#
# act and markets carry readable identities (a CELEX, a market code);
# config.DeriveRefs() rewrites them to the derived ids at load, so an act need
# not be ingested yet. A row naming markets screens every product sold there; one
# naming none screens the products classified into its act, which is what keeps a
# cosmetics claim rule off a "BPA-free" charger.

# GPSR Article 19: the distance-sales offer itself states who answers for the
# product. Horizontal, so bound to the market rather than the act: an
# unclassified product still owes it.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-gpsr-responsible-person
  name: No responsible person on the offer
  act: '32023R0988'
  provision: Article 19(b)
  description: >-
    where the manufacturer is not established in the Union, the name, postal and
    electronic address of the responsible person
  from: '2024-12-13T00:00:00Z'
  evaluator: cel
  # A manufacturer contact in a member state needs no responsible person. One
  # naming no country keeps the finding: an unknown establishment is not an EU one.
  rule: >-
    (listing.responsiblePerson == "" || listing.responsiblePersonContact == "") &&
    !(listing.manufacturerCountry in ["at", "be", "bg", "hr", "cy", "cz", "dk", "ee", "fi", "fr",
    "de", "gr", "hu", "ie", "it", "lv", "lt", "lu", "mt", "nl", "pl", "pt", "ro", "sk", "si", "es", "se"])
  outcome: fix
  class: gap
  markets:
    - EU
---
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-gpsr-traceability
  name: Traceability block incomplete
  act: '32023R0988'
  provision: Article 19(a) and (c)
  description: >-
    name, registered trade name or registered trade mark of the manufacturer, as
    well as the postal and electronic address at which they can be contacted;
    [...] information allowing the identification of the product, including a
    picture of it, its type and any other product identifier
  from: '2024-12-13T00:00:00Z'
  evaluator: cel
  rule: >-
    listing.productIdentifier == "" || listing.manufacturer == "" || listing.manufacturerContact == ""
  outcome: fix
  class: gap
  markets:
    - EU
---
# CLP: the two label traces a hazardous mixture's offer shows. Neither absence
# proves the mixture owes a label, which only its formula settles, so both ask
# for a look rather than accuse. A label shown with no health or physical hazard
# element (an H2xx or H3xx code, GHS01 to GHS08, the Danger signal word) settles
# the UFI ask: Annex VIII notification covers only those. GHS09 and Warning stay
# neutral, since Aquatic Chronic 1 carries both; the leading boundary keeps
# EUH208 from reading as H208.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-clp-hazard-label
  name: No hazard label elements on the offer
  act: '32008R1272'
  provision: Article 48(2)
  description: >-
    Any advertisement for a mixture classified as hazardous or covered by Article
    25(6) which allows a member of the general public to conclude a contract for
    purchase without first having sight of the label shall mention the type or
    types of hazard indicated on the label.
  evaluator: cel
  rule: listing.hazardLabel == ""
  outcome: review
  class: gap
---
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-clp-ufi
  name: No UFI on the offer
  act: '32008R1272'
  provision: Article 45(1)
  description: >-
    Importers and downstream users placing mixtures on the market shall submit to
    the appointed bodies [...] information relating to mixtures placed on the
    market and classified as hazardous on the basis of their health or physical
    effects
  evaluator: cel
  rule: >-
    listing.ufi == "" && (listing.hazardLabel == "" ||
    listing.hazardLabel.matches(r'\bH[23]\d\d|\bGHS0[1-8]\b|(?i:\bdanger\b)'))
  outcome: review
  class: gap
---
# Cosmetics Article 19(1)(g): the list-shape rules, exclusive by construction. A
# list of four lines or fewer is likely truncated: a cosmetic list typically runs
# 15 to 50.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-cosmetics-ingredient-list-missing
  name: Ingredient list missing
  act: '32009R1223'
  provision: Article 19(1)(g)
  description: >-
    a list of ingredients. This information may be indicated on the packaging
    alone. The list shall be preceded by the term 'ingredients'.
  evaluator: cel
  rule: size(listing.ingredients) == 0
  outcome: fix
  class: gap
---
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-cosmetics-ingredient-list-short
  name: Ingredient list looks truncated
  act: '32009R1223'
  provision: Article 19(1)(g)
  description: >-
    a list of ingredients. This information may be indicated on the packaging
    alone. The list shall be preceded by the term 'ingredients'.
  evaluator: cel
  # The length of a list that is not there is not read: the rule above owns it.
  rule: >-
    size(listing.ingredients) == 0 ? null : size(listing.ingredients) <= 4
  outcome: review
  class: gap
---
# Toy Safety Directive Article 11(2): a warning that decides a purchase shows
# before it, online too. Whether a picture or a line of copy carries it is a
# reading a regex cannot do in 24 languages, so a decision model answers.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-toys-warnings-before-purchase
  name: Toy warnings not shown before purchase
  act: '32009L0048'
  provision: Article 11(2)
  description: >-
    Warnings which determine the decision to purchase the toy, such as those
    specifying the minimum and maximum ages of users, and the other applicable
    warnings set out in Annex V, shall appear on the consumer packaging or be
    otherwise clearly visible to the consumer before the purchase, including in
    cases where the purchase is made on-line.
  from: '2011-07-20T00:00:00Z'
  evaluator: decision
  rule: >-
    Does this offer show the toy's warnings, such as the minimum or maximum age
    of its users, clearly before purchase?
  outcome: fix
  class: gap
---
# The Appendix D claim screen: cosmetics claims under Article 20, where there is
# no allowlist and a match asks for the evidence behind it.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: clinically-proven
  name: Clinically proven
  act: '32009R1223'
  provision: Article 20(1)
  description: &cosmeticClaims >-
    In the labelling, making available on the market and advertising of cosmetic
    products, text, names, trade marks, pictures and figurative or other signs
    shall not be used to imply that these products have characteristics or
    functions which they do not have.
  evaluator: cel
  rule: >-
    listing.text == "" ? null : regex.extractAll(listing.text, r'(?i)clinically\s+proven')
  outcome: review
  class: breach
  substantiation: clinical evidence
