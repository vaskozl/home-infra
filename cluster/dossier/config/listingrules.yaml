# Health claims on foods under Regulation (EC) No 1924/2006: a different regime,
# not more rows of the screen above. It publishes an allowlist, so a wording
# absent from the market's register is the breach and the rule returns the
# matches the register does not carry. With no register mirrored the rule
# returns null: checked against nothing, the claim is neither permitted nor
# prohibited. The vitamin C row matches a wording that IS authorised: the screen
# finds claims and the register grades them, so a permitted claim is an observed
# result rather than the absence of a rule.
# A match is folded the way the register is before it is looked up: crawled copy
# wraps lines, and a wrapped authorised wording is still the authorised wording.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: food-immune-boost
  name: Boosts the immune system
  act: '32006R1924'
  provision: Article 10(1)
  description: &healthClaims >-
    Health claims shall be prohibited unless they comply with the general
    requirements in Chapter II and the specific requirements in this Chapter and
    are authorised in accordance with this Regulation and included in the lists of
    authorised claims provided for in Articles 13 and 14.
  evaluator: cel
  rule: >-
    authorised == null || listing.text == "" ? null :
    regex.extractAll(listing.text, r'(?i)\bboosts?\s+(?:your\s+)?immune\s+system\b')
    .filter(c, !authorised.exists(a, a.contains(regex.replace(c.lowerAscii(), r'\s+', ' '))))
  outcome: fix
  class: breach
  substantiation: an authorised wording on the Union register
---
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: food-gut-health
  name: Supports gut health
  act: '32006R1924'
