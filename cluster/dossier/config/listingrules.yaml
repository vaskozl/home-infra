# Directive (EU) 2024/825 adds to the Annex I blacklist of the Unfair Commercial
# Practices Directive from 27 September 2026: a generic environmental claim
# without recognised excellent environmental performance (point 4a), and a
# neutral, reduced or positive impact claimed on offsetting (point 4c). A match
# asks for the certification behind it. Seeded, not ingested, like ESPR; bound
# to the market, since the ban reads every product's copy.
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-green-generic-environmental-claim
  name: Generic environmental claim
  act: '32024L0825'
  provision: Annex
  description: >-
    Making a generic environmental claim for which the trader is not able to
    demonstrate recognised excellent environmental performance relevant to the
    claim.
  from: '2026-09-27T00:00:00Z'
  evaluator: cel
  rule: >-
    listing.text == "" ? null : regex.extractAll(listing.text,
    r'(?i)\b(?:eco[-\s]?friendly|environmentally[-\s]friendly|environment[-\s]friendly|earth[-\s]friendly|planet[-\s]friendly|nature[-\s]friendly|climate[-\s]friendly|eco[-\s]?conscious|eco[-\s]?responsible|biodegradable|green(?:er)?\s+(?:product|choice|alternative|option))\b')
  outcome: review
  class: breach
  substantiation: >-
    an EU Ecolabel licence, or an officially recognised EN ISO 14024 type I
    ecolabel, for this product
  markets:
    - EU
---
apiVersion: v1alpha1
kind: listingrules
spec:
  slug: eu-green-offsetting-claim
  name: Climate claim that may rest on offsetting
  act: '32024L0825'
  provision: Annex
  description: >-
    Claiming, based on the offsetting of greenhouse gas emissions, that a product
    has a neutral, reduced or positive impact on the environment in terms of
    greenhouse gas emissions.
  from: '2026-09-27T00:00:00Z'
  evaluator: cel
  rule: >-
    listing.text == "" ? null : regex.extractAll(listing.text,
    r'(?i)\b(?:climate[-\s]neutral|carbon[-\s]neutral|co2[-\s]neutral|net[-\s]zero|carbon[-\s]positive|climate[-\s]positive|carbon[-\s]negative|(?:carbon|climate|co2)[-\s]compensated)\b')
  outcome: review
  class: breach
  substantiation: >-
    a life-cycle assessment showing the impact claimed comes from the product
    itself rather than from offsetting
  markets:
    - EU
