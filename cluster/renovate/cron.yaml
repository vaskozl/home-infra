# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/cronjob-batch-v1.json
# yaml-lanaguage-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '15 2,3,4 * * *'
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: renovate
              image: ghcr.io/vaskozl/renovate:44.262.1@sha256:68bca368867f125634467d6176af7937e9fd242deda9cfe8b62da4e8b2808d19
              # Environment Variables
              env:
                - name: LOG_LEVEL
                  value: debug
                - name: BINARY_SOURCE
                  value: install
                # Clones are ephemeral; only the cache persists.
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: RENOVATE_CACHE_DIR
                  value: /cache
                - name: RENOVATE_ALLOWED_COMMANDS
                  value: |-
                    ["^\\.gitlab/bump-epochs\\.pl --base-ref HEAD$", "^tools/tidy\\.sh$"]
              envFrom:
                - secretRef:
                    name: renovate-env
              resources:
                requests:
                  cpu: 740m
                  memory: 1.3Gi
                limits:
                  memory: 1.3Gi
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: base
                  mountPath: /tmp/renovate
                - name: cache
                  mountPath: /cache
          restartPolicy: Never
          volumes:
            - name: base
              emptyDir: {}
            - name: cache
              persistentVolumeClaim:
                claimName: renovate-cache
