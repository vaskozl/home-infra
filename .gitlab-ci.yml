workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test

.flate:
  stage: test
  tags: [arm64]
  image:
    name: ghcr.io/vaskozl/flate:0.6.5
    entrypoint: [""]
  variables:
    FLATE_VERSION: "0.6.5"
    FLATE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/flate"
    FLATE_CACHE_POLICY: pull
  cache:
    key: "flate-${FLATE_VERSION}-4"
    # Share main's warm chart cache with MR pipelines. Only main pushes it:
    # concurrent writers on the shared NFS cache truncate the archive.
    policy: $FLATE_CACHE_POLICY
    unprotect: true
    paths:
      - .cache/flate/
  retry:
    max: 2
    when: [runner_system_failure]

flate:
  extends: .flate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        FLATE_CACHE_POLICY: pull-push
    - when: on_success
  script:
    - flate test all --path cluster --no-progress

flate:diff:
  extends: .flate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    # flate reads the base commit from the local clone
    GIT_DEPTH: 0
  script:
    - flate diff all --path cluster --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --no-progress -o html > flate-diff.html
    - flate diff all --path cluster --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --no-progress
  artifacts:
    expose_as: flate diff
    paths:
      - flate-diff.html
    expire_in: 1 week
    when: always
