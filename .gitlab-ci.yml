workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test

.flate:
  stage: test
  tags: [arm64]
  # All flate jobs share one cache.zip on the NFS runner cache; a push from
  # one node while another extracts it leaves a half-restored cache.
  resource_group: flate-cache
  image:
    name: ghcr.io/vaskozl/flate:0.6.5@sha256:793305fa0facbfca13f9ea96320b2ac208e5ceb9ef6721ee4429a21c825a94cd
    entrypoint: [""]
  variables:
    FLATE_VERSION: "0.6.5"
    FLATE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/flate"
    FLATE_CACHE_POLICY: pull
  cache:
    key: "flate-${FLATE_VERSION}-4"
    # Share main's warm chart cache with MR pipelines. Only main pushes it:
    # concurrent writers on the shared NFS cache truncate the archive.
    policy: $FLATE_CACHE_POLICY
    unprotect: true
    paths:
      - .cache/flate/
  retry:
    max: 2
    when: [runner_system_failure]

flate:
  extends: .flate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        FLATE_CACHE_POLICY: pull-push
    - when: on_success
  script:
    - flate test all --path cluster --no-progress
