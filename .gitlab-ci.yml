workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test

.flate:
  stage: test
  tags: [arm64]
  image:
    name: ghcr.io/vaskozl/flate:0.6.5
    entrypoint: [""]
  variables:
    FLATE_VERSION: "0.6.5"
    FLATE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/flate"
  cache:
    key: "flate-${FLATE_VERSION}-3"
    # Share main's warm chart cache with MR pipelines
    unprotect: true
    paths:
      - .cache/flate/
  retry:
    max: 2
    when: [runner_system_failure]

flate:
  extends: .flate
  script:
    - flate test all --path cluster --no-progress
